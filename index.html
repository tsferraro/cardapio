:root{
  --bg:#F4F5F8;
  --card:#FFFFFF;
  --surf:#EEF0F5;
  --ink:#101622;
  --mute:#4A5061;
  --line:#DCE0E8;
  --now:#123EB2;
  --now-ink:#F8FCFF;
  --now-soft:#C4D5FA;
  --now-tint:#E3EBFD;
  --done:#156F41;
  --done-tint:#DDF1E4;
  --warn:#B0300A;
  --warn-tint:#FFEBD9;
  --alert:#8A4B00;
  --alert-tint:#FFF1D6;
  --ex:#FFE45C;
  --on-color:#FFFFFF;
  --t-peixe:#0E7490;  --t-peixe-bg:#E0F3F7;  --t-peixe-tx:#0B5A70;
  --t-ave:#B45309;    --t-ave-bg:#FDEFDD;    --t-ave-tx:#8A3F06;
  --t-verm:#BE123C;   --t-verm-bg:#FDE6EB;   --t-verm-tx:#9F1239;
  --t-ovo:#A16207;    --t-ovo-bg:#FBF2D3;    --t-ovo-tx:#774804;
  --t-veg:#4D7C0F;    --t-veg-bg:#ECF5DB;    --t-veg-tx:#3D6310;
  --t-leg:#7C3AED;    --t-leg-bg:#F0E8FE;    --t-leg-tx:#5B21B6;
  --t-folha:#15803D;  --t-folha-bg:#DFF3E5;  --t-folha-tx:#14532D;
  --t-rapido:#A21CAF; --t-rapido-bg:#FAE7FB; --t-rapido-tx:#7E1A89;
  --t-tempo:#475569;  --t-tempo-bg:#EDF0F4;  --t-tempo-tx:#334155;
  --t-livre:#5B6474;  --t-livre-bg:#EEF0F4;  --t-livre-tx:#3B4252;
  --s-nutri-tx:#0F5132; --s-nutri-bg:#FFFFFF;
  --s-familia-tx:#7A2E0E; --s-familia-bg:#FFFFFF;
  --s-infl-tx:#9D174D; --s-infl-bg:#FFFFFF;
  --r:18px;--r-sm:12px;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;
  --f:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,sans-serif;
  --sh-sm:0 1px 2px rgba(16,22,34,.06);
  --sh-md:0 6px 22px rgba(16,22,34,.08);
  --sh-lg:0 12px 34px rgba(16,22,34,.16);
  --z-sticky:10;--z-dock:15;--z-nav:20;--z-veil:24;--z-sheet:25;--z-timer:30;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:17px;line-height:1.4;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding:0 var(--s4) 112px}
.app.flow{padding-bottom:240px}
.app.wide{max-width:1180px}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--now)}
:focus-visible{outline:3px solid var(--now);outline-offset:3px}
h1,h2,h3,h4{text-wrap:balance}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

/* topo */
.topo{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding:calc(env(safe-area-inset-top) + 14px) 0 var(--s3)}
.topo h1{font-size:24px;font-weight:800;margin:0;letter-spacing:-.01em;line-height:1.15}
.topo .sub{display:block;font-size:15px;color:var(--mute);font-weight:500;margin-top:2px}
.sync{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:700;color:var(--mute);white-space:nowrap;box-shadow:var(--sh-sm);text-decoration:none}
.sync svg{width:18px;height:18px}
.sync.ok svg{color:var(--done)}
.sync.off{background:var(--alert-tint);border-color:#F0D49A;color:var(--alert)}
.sync.err{background:var(--warn-tint);border-color:#F4C4A8;color:var(--warn)}
.sync.busy svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* fluxo de planejar */
.flowbar{display:flex;align-items:center;gap:var(--s3);padding:calc(env(safe-area-inset-top) + 10px) 0 var(--s2)}
.flowbar .x{display:grid;place-items:center;width:48px;height:48px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--ink);text-decoration:none;box-shadow:var(--sh-sm)}
.flowbar .t{flex:1;min-width:0}
.flowbar .t b{display:block;font-size:15px;color:var(--mute);font-weight:700}
.flowbar .t h1{margin:0;font-size:24px;font-weight:800;line-height:1.15}
.steps5{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:var(--s2) 0 var(--s4)}
.steps5 span{font-size:13px;font-weight:700;color:var(--mute);border-top:5px solid var(--line);padding-top:5px;line-height:1.15}
.steps5 span.done{border-color:var(--done);color:var(--done)}
.steps5 span.cur{border-color:var(--now);color:var(--now)}

/* cartões e blocos */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh-sm);border:1px solid var(--line);padding:var(--s4)}
.card+.card,.card+.sec,.sec+.card{margin-top:var(--s3)}
h2.t{font-size:21px;font-weight:800;margin:var(--s6) 0 var(--s3);letter-spacing:-.01em}
h2.t small{font-size:15px;font-weight:500;color:var(--mute);margin-left:6px}
h3.h{font-size:19px;font-weight:800;margin:0 0 var(--s2)}
.mut{color:var(--mute)}
.small{font-size:15px}
.row{display:flex;align-items:center;gap:var(--s3)}
.row.top{align-items:flex-start}
.grow{flex:1;min-width:0}
.list{list-style:none;margin:0;padding:0}

/* botões */
.bt{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 var(--s4);border-radius:var(--r-sm);border:0;font-size:18px;font-weight:800;cursor:pointer;text-decoration:none;transition:transform .15s var(--ease),background .15s}
.bt:active{transform:scale(.98)}
.bt.full{width:100%}
.bt.big{min-height:60px;font-size:20px}
.bt.pri{background:var(--now);color:var(--now-ink)}
.bt.inv{background:var(--now-ink);color:var(--now)}
.bt.sec{background:var(--card);color:var(--ink);border:2px solid var(--line);font-weight:700}
.bt.ghost{background:transparent;color:var(--now-ink);border:2px solid var(--now-soft);font-weight:700}
.bt.ok{background:var(--done);color:#fff}
.bt[disabled],.bt[aria-disabled="true"]{background:var(--surf);color:var(--mute);border-color:var(--surf);cursor:not-allowed}
.bt svg{width:22px;height:22px;stroke-width:2.4}
.lnk{display:inline-flex;align-items:center;gap:6px;min-height:44px;font-weight:700;text-decoration:none;color:var(--now);background:none;border:0;padding:0;cursor:pointer;font-size:17px}
.btrow{display:grid;grid-template-columns:1fr 1fr;gap:var(--s2);margin-top:var(--s3)}

/* etiquetas coloridas (tipo) */
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tg{display:inline-flex;align-items:center;gap:6px;padding:2px 11px 2px 9px;border-radius:999px;font-size:15px;font-weight:700;line-height:24px;white-space:nowrap;background:var(--bgc);color:var(--txc)}
.tg::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c);flex:0 0 9px}
.tg.peixe{--c:var(--t-peixe);--bgc:var(--t-peixe-bg);--txc:var(--t-peixe-tx)}
.tg.ave{--c:var(--t-ave);--bgc:var(--t-ave-bg);--txc:var(--t-ave-tx)}
.tg.verm{--c:var(--t-verm);--bgc:var(--t-verm-bg);--txc:var(--t-verm-tx)}
.tg.ovo{--c:var(--t-ovo);--bgc:var(--t-ovo-bg);--txc:var(--t-ovo-tx)}
.tg.veg{--c:var(--t-veg);--bgc:var(--t-veg-bg);--txc:var(--t-veg-tx)}
.tg.leg{--c:var(--t-leg);--bgc:var(--t-leg-bg);--txc:var(--t-leg-tx)}
.tg.folha{--c:var(--t-folha);--bgc:var(--t-folha-bg);--txc:var(--t-folha-tx)}
.tg.rapido{--c:var(--t-rapido);--bgc:var(--t-rapido-bg);--txc:var(--t-rapido-tx)}
.tg.medio,.tg.longo{--c:var(--t-tempo);--bgc:var(--t-tempo-bg);--txc:var(--t-tempo-tx)}
.tg.livre{--c:var(--t-livre);--bgc:var(--t-livre-bg);--txc:var(--t-livre-tx)}
.tg.medio::before,.tg.longo::before,.tg.rapido::before{border-radius:2px;width:9px;height:9px;transform:rotate(45deg)}

/* selos (origem): contorno, gramática diferente das etiquetas */
.selo{display:inline-flex;align-items:center;gap:5px;padding:0 10px 0 7px;border-radius:999px;border:2px solid currentColor;font-size:14px;font-weight:800;line-height:22px;white-space:nowrap;background:var(--card)}
.selo svg{width:15px;height:15px;stroke-width:2.4}
.selo.nutri{color:var(--s-nutri-tx)}
.selo.familia{color:var(--s-familia-tx)}
.selo.infl{color:var(--s-infl-tx)}
.selo.nova,.selo.adapt{color:var(--mute);border-style:dashed}
.on-now .selo{background:transparent;color:var(--now-ink);border-color:var(--now-soft)}
.on-now .plate .selo{background:var(--card);color:var(--mute);border-color:currentColor}
.ex{display:inline-flex;align-items:center;gap:4px;background:var(--ex);color:var(--ink);font-size:13px;font-weight:800;border-radius:6px;padding:0 7px;line-height:22px;white-space:nowrap;vertical-align:2px}
.ex::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink)}

/* pílulas de estado */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:0 10px;font-size:14px;font-weight:800;line-height:26px;white-space:nowrap}
.pill svg{width:16px;height:16px;stroke-width:2.6}
.pill.ok{background:var(--done-tint);color:var(--done)}
.pill.falha{background:var(--warn);color:#fff}
.pill.alerta{background:var(--alert-tint);color:var(--alert)}
.pill.na{background:var(--surf);color:var(--mute)}
.pill.now{background:var(--now-tint);color:var(--now)}

/* barra inferior */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:var(--z-nav);display:flex;justify-content:center;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(0deg,var(--bg) 62%,rgba(244,245,248,0))}
.nav .in{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;width:100%;max-width:520px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:5px;box-shadow:var(--sh-lg)}
.nav a{min-height:60px;border-radius:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:14px;font-weight:700;color:var(--mute);text-decoration:none;transition:background .18s var(--ease),color .18s}
.nav a svg{width:25px;height:25px}
.nav a[aria-current="page"]{color:var(--now);background:var(--now-tint)}

/* HOJE: linha do tempo */
.tl{list-style:none;margin:var(--s2) 0 0;padding:0}
.tl>li{position:relative;padding:0 0 var(--s5) 58px}
.tl>li::before{content:"";position:absolute;left:21px;top:30px;bottom:0;width:2px;background:var(--line)}
.tl>li:last-child::before{display:none}
.tl .when{position:absolute;left:0;top:2px;width:44px;text-align:center;font-weight:800;font-size:14px;color:var(--mute);line-height:1.15}
.tl .dot{position:absolute;left:15px;top:34px;width:14px;height:14px;border-radius:50%;background:var(--line);border:3px solid var(--bg)}
.tl .past .when,.tl .past .dot{color:var(--done)} .tl .past .dot{background:var(--done)}
.tl .cur .when{color:var(--now)} .tl .cur .dot{background:var(--now);box-shadow:0 0 0 4px var(--now-tint)}
.done-row{display:flex;align-items:center;gap:var(--s2);color:var(--mute);font-size:16px;min-height:44px}
.done-row svg{color:var(--done);stroke-width:3}
.agora{background:var(--now);color:var(--now-ink);border-radius:var(--r);padding:var(--s5) var(--s4) var(--s4);box-shadow:0 10px 28px rgba(18,62,178,.28)}
.agora .k{display:inline-flex;align-items:center;gap:6px;font-size:15px;font-weight:800;background:var(--now-ink);color:var(--now);border-radius:999px;padding:1px 12px 1px 9px;margin-bottom:var(--s3)}
.agora h3{font-size:31px;line-height:1.08;margin:0 0 4px;font-weight:800;letter-spacing:-.015em}
.agora .rest{margin:0;color:var(--now-soft);font-size:17px}
.agora .facts{display:flex;flex-wrap:wrap;gap:var(--s2) var(--s5);margin:var(--s4) 0;align-items:flex-end}
.agora .num{font-size:40px;font-weight:800;line-height:1}
.agora .num small{font-size:18px;font-weight:700;margin-left:3px}
.agora .who{font-size:16px;color:var(--now-soft);line-height:1.3}
.agora .who b{display:block;color:var(--now-ink);font-size:17px}
.plate{margin-top:var(--s3);background:var(--card);border-radius:var(--r);padding:var(--s3) var(--s4);color:var(--ink)}
.plate h4{margin:0 0 var(--s2);font-size:16px;font-weight:800;color:var(--mute)}
.plate dl{display:grid;grid-template-columns:auto 1fr;gap:8px var(--s3);margin:0;font-size:17px;align-items:baseline}
.plate dt{font-weight:800;color:var(--mute);font-size:14px}
.plate dd{margin:0;font-weight:700}
.julia{display:flex;gap:var(--s3);align-items:flex-start;margin-top:var(--s3);padding-top:var(--s3);border-top:1px solid var(--line)}
.julia .av{flex:0 0 40px;height:40px;border-radius:50%;background:var(--t-ave-bg);color:var(--t-ave-tx);display:grid;place-items:center;font-weight:800}
.julia b{display:block}
.task{display:flex;gap:var(--s3);align-items:flex-start;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:var(--s3);cursor:pointer;box-shadow:var(--sh-sm)}
.task+.task{margin-top:var(--s2)}
.box{flex:0 0 48px;height:48px;border-radius:12px;border:3px solid var(--ink);background:var(--card);display:grid;place-items:center}
.box svg{width:28px;height:28px;stroke:#fff;stroke-width:3.5;opacity:0}
[aria-checked="true"] .box{background:var(--done);border-color:var(--done)}
[aria-checked="true"] .box svg{opacity:1}
.task b{display:block;font-size:18px;line-height:1.25}
.task .det{display:block;color:var(--mute);font-size:15px;margin-top:3px}
.task[aria-checked="true"] b{text-decoration:line-through;color:var(--mute)}
.task .kind{display:block;color:var(--now);font-weight:800;font-size:13px;margin-bottom:2px}
.remind{display:flex;align-items:center;gap:var(--s3);background:var(--card);border:2px dashed var(--now-soft);border-radius:var(--r);padding:var(--s3)}
.remind .ico{flex:0 0 48px;height:48px;border-radius:14px;background:var(--now-tint);color:var(--now);display:grid;place-items:center}
.tomorrow .line{display:flex;gap:var(--s3);padding:10px 0;border-top:1px solid var(--line);font-size:16px}
.tomorrow .line:first-of-type{border-top:0}
.tomorrow .line b.l{flex:0 0 76px;color:var(--mute);font-size:14px;font-weight:800;padding-top:2px}

/* panela (detalhe) */
details.det{margin-top:var(--s3);background:var(--card);border-radius:var(--r);color:var(--ink);border:1px solid var(--line)}
details.det>summary{list-style:none;min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:var(--s2);padding:0 var(--s4);font-weight:800;font-size:17px;cursor:pointer}
details.det>summary::-webkit-details-marker{display:none}
details.det>summary .chev{transition:transform .2s var(--ease)}
details.det[open]>summary .chev{transform:rotate(180deg)}
.panela{padding:0 var(--s4) var(--s3)}
.pn{display:grid;grid-template-columns:1fr auto;gap:2px var(--s3);padding:10px 0;border-top:1px solid var(--line)}
.pn b{font-size:17px}
.pn .q{font-size:22px;font-weight:800;text-align:right;white-space:nowrap}
.pn .q small{font-size:14px;font-weight:700}
.pn .c{grid-column:1/-1;font-size:14px;color:var(--mute)}
.pn .raw{font-size:14px;color:var(--mute);text-align:right;white-space:nowrap}

/* modo cozinha */
.cook{display:flex;flex-direction:column;min-height:calc(100vh - 20px);padding-top:var(--s3)}
.cook .head{display:flex;align-items:center;gap:var(--s3)}
.cook .head .t{flex:1;min-width:0;font-weight:800;font-size:17px;line-height:1.2}
.wake{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--done);background:var(--done-tint);border-radius:999px;padding:0 10px;line-height:28px}
.prog{display:flex;gap:6px;margin:var(--s4) 0}
.prog span{flex:1;height:8px;border-radius:4px;background:var(--line)}
.prog span.on{background:var(--now)}
.cook .k{font-size:17px;font-weight:800;color:var(--now)}
.cook .step{font-size:27px;line-height:1.3;font-weight:700;margin:var(--s2) 0 var(--s4);text-wrap:pretty}
.chips{display:flex;flex-wrap:wrap;gap:var(--s2)}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 14px;font-size:17px;font-weight:700}
.timer{display:flex;align-items:center;gap:var(--s3);background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:var(--s3);margin-top:var(--s4)}
.timer .clock{font-size:44px;font-weight:800;line-height:1;letter-spacing:-.01em;min-width:132px}
.timer .lb{font-size:15px;color:var(--mute);font-weight:700}
.timer.run{border-color:var(--now);background:var(--now-tint)}
.timer.run .clock{color:var(--now)}
.timer.end{border-color:var(--warn);background:var(--warn-tint)}
.timer.end .clock{color:var(--warn)}
.tbt{display:grid;place-items:center;min-width:60px;height:60px;border-radius:16px;border:0;background:var(--now);color:var(--now-ink);cursor:pointer;font-weight:800;font-size:15px}
.tbt.soft{background:var(--surf);color:var(--ink);min-width:52px;height:52px}
.tbt svg{width:28px;height:28px}
.cook .foot{margin-top:auto;display:grid;grid-template-columns:1fr 2fr;gap:var(--s2);padding:var(--s4) 0 var(--s3)}
.tdock{position:sticky;top:0;z-index:var(--z-timer);display:flex;gap:var(--s2);overflow-x:auto;padding:var(--s2) 0;background:var(--bg)}
.tdock a{flex:0 0 auto;display:flex;align-items:center;gap:8px;min-height:48px;padding:0 14px;border-radius:14px;background:var(--now);color:var(--now-ink);text-decoration:none;font-weight:800;font-size:16px}
.tdock a.end{background:var(--warn)}
.tdock a small{font-weight:500;opacity:.9}

/* SEMANA */
.cycle{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:var(--s4);box-shadow:var(--sh-sm)}
.cycle .wk{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s2)}
.cycle .wk b{font-size:18px}
.segs{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;margin:var(--s3) 0 6px}
.segs span{height:8px;border-radius:4px;background:var(--line)}
.segs span.done{background:var(--done)}
.segs span.cur{background:var(--now)}
.cycle .st{display:flex;justify-content:space-between;gap:var(--s2);font-size:14px;color:var(--mute);font-weight:700}
.cycle .st b{color:var(--now)}
.cycle .next{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);margin-top:var(--s3);padding-top:var(--s3);border-top:1px solid var(--line)}
.cycle .next .l{font-size:15px;color:var(--mute)}
.cycle .next .l b{display:block;color:var(--ink);font-size:17px}
.cycle .next .bt{min-height:48px;font-size:17px;flex:0 0 auto}
.wkswitch{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surf);border-radius:14px;padding:4px;margin:var(--s3) 0}
.wkswitch a{min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:11px;text-decoration:none;color:var(--mute);font-weight:800;font-size:16px;line-height:1.15}
.wkswitch a small{font-weight:500;font-size:13px}
.wkswitch a[aria-current="page"]{background:var(--card);color:var(--ink);box-shadow:var(--sh-sm)}
.daytabs{display:flex;gap:6px;overflow-x:auto;padding:4px 6px 10px;margin:0 -6px;scrollbar-width:none}
.daytabs::-webkit-scrollbar{display:none}
/* chip do dia: pintado inteiro pela proteína do jantar (decisão 1 refinada); texto branco (on-color, todas as cores >= 4,92:1) */
.dtab{position:relative;overflow:hidden;isolation:isolate;flex:0 0 auto;min-width:64px;min-height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;border-radius:15px;border:0;background:var(--c,var(--t-livre));color:var(--on-color);text-decoration:none;box-shadow:var(--sh-sm);padding:6px 8px;margin:4px 2px}
.dtab .dw{font-size:13px;font-weight:800;color:var(--on-color)}
.dtab .dn{font-size:21px;font-weight:800;line-height:1.05}
.dtab.today{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--now)}
.dtab .hj{font-size:12px;font-weight:800;line-height:1;margin-top:3px;letter-spacing:.02em}
/* marca d'água: ícone da proteína atrás do texto; escurece a cor (preto 16%), então só aumenta o contraste do branco */
.wm{position:absolute;z-index:-1;right:-9px;bottom:-9px;width:46px;height:46px;stroke:#000;opacity:.16;stroke-width:2.2;pointer-events:none}
.day{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-sm);margin-top:var(--s3);overflow:hidden}
.day.is-today{border:2px solid var(--now)}
.day .hd{display:flex;gap:var(--s3);align-items:flex-start;padding:var(--s3) var(--s3) var(--s3)}
.dchip{position:relative;overflow:hidden;isolation:isolate;flex:0 0 56px;height:60px;border-radius:14px;background:var(--c,var(--t-livre));color:var(--on-color);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;line-height:1.05}
.dchip .wm{width:40px;height:40px;right:-8px;bottom:-8px}
.dchip b{font-size:22px}
.dchip small{font-size:13px;font-weight:700}
.day .nm{font-size:18px;font-weight:800;line-height:1.22}
.day .ev{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.evt{display:inline-flex;align-items:center;gap:5px;font-size:14px;font-weight:700;color:var(--mute);background:var(--surf);border-radius:8px;padding:1px 8px;line-height:24px}
.evt svg{width:15px;height:15px}
.day .tags{margin-top:8px}
.day .meta{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:15px;color:var(--mute)}
.day .meta b{color:var(--ink)}
.day details{border-top:1px solid var(--line)}
.day details summary{list-style:none;min-height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 var(--s3);font-weight:700;font-size:16px;color:var(--now);cursor:pointer}
.day details summary::-webkit-details-marker{display:none}
.day details dl{display:grid;grid-template-columns:auto 1fr;gap:8px var(--s3);margin:0;padding:0 var(--s3) var(--s3);font-size:16px}
.day details dt{font-weight:800;color:var(--mute);font-size:14px;padding-top:2px}
.day details dd{margin:0}
.day .ctrl{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:6px;padding:0 8px 8px}
.day .ctrl .cbt{justify-content:center;padding:0 6px}
.cbt{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:15px;cursor:pointer;color:var(--ink);text-decoration:none}
.cbt svg{width:18px;height:18px}
.cbt[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
.day.bad{border:2px solid var(--warn)}
.day.warnd{border:2px solid #E7B35C}
.day .issue{display:flex;gap:8px;align-items:flex-start;margin:0 var(--s3) var(--s3);padding:10px 12px;border-radius:12px;font-size:15px;font-weight:700}
.day .issue.falha{background:var(--warn-tint);color:var(--warn)}
.day .issue.alerta{background:var(--alert-tint);color:var(--alert)}
.day .issue svg{width:20px;height:20px;margin-top:1px}
.day.locked .dchip{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--ink)}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:var(--s2)}
.meter{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.meter .lb{font-size:14px;font-weight:700;color:var(--mute)}
.meter .v{font-size:24px;font-weight:800;line-height:1.1;margin-top:2px}
.meter .v small{font-size:15px;color:var(--mute);font-weight:700}
.meter .why{font-size:14px;margin-top:4px;display:flex;align-items:center;gap:5px;font-weight:700}
.meter .why.ok{color:var(--done)} .meter .why.low{color:var(--warn)} .meter .why.na{color:var(--mute)}
.meter .why svg{width:16px;height:16px;stroke-width:2.6}
.foot-note{font-size:15px;color:var(--mute);margin-top:var(--s3)}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:var(--s2)}

/* Semana larga: quadro de 7 colunas */
@media (min-width:900px){
  .app.wide .board{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;align-items:start}
  .app.wide .board .day{margin-top:0}
  .app.wide .board .day .hd{flex-direction:column}
  .app.wide .board .dchip{width:100%;flex:0 0 auto;height:48px;flex-direction:row;gap:8px}
  .app.wide .board .day .nm{font-size:16px}
  .app.wide .board .tg{font-size:14px}
  .app.wide .board .day details{display:block}
  .app.wide .wide-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:var(--s4);align-items:start}
  .app.wide .daytabs{display:none}
}

/* ESTOQUE */
.inputs{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:var(--s2)}
.inbt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:96px;border-radius:var(--r);border:2px solid var(--line);background:var(--card);font-weight:800;font-size:17px;cursor:pointer;text-decoration:none;color:var(--ink);box-shadow:var(--sh-sm)}
.inbt svg{width:30px;height:30px}
.inbt.pri{background:var(--now);border-color:var(--now);color:var(--now-ink)}
.loc{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:800;color:var(--mute);margin:var(--s5) 0 var(--s2)}
.loc svg{width:20px;height:20px}
.item{display:flex;align-items:center;gap:var(--s3);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:var(--sh-sm)}
.item+.item{margin-top:6px}
.item .nm{font-size:18px;font-weight:700;line-height:1.2}
.item .sb{font-size:14px;color:var(--mute);margin-top:2px}
.item .q{font-size:19px;font-weight:800;white-space:nowrap;text-align:right}
.item .q small{display:block;font-size:13px;font-weight:700;color:var(--mute)}
.item.prov{border:2px solid #E7B35C}
.photo{height:180px;border-radius:var(--r);background:repeating-linear-gradient(135deg,var(--surf) 0 14px,#E6E9F0 14px 28px);display:grid;place-items:center;color:var(--mute);font-weight:700;font-size:15px;border:1px solid var(--line)}
.sk{border-radius:12px;background:var(--surf);position:relative;overflow:hidden}
.sk::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);animation:sh 1.3s var(--ease) infinite}
@keyframes sh{to{transform:translateX(100%)}}
.stat{display:flex;gap:var(--s3);align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:var(--s4);box-shadow:var(--sh-sm)}
.stat .ico{flex:0 0 52px;height:52px;border-radius:15px;display:grid;place-items:center}
.stat .ico.b{background:var(--now-tint);color:var(--now)}
.stat .ico.w{background:var(--warn-tint);color:var(--warn)}
.stat .ico.a{background:var(--alert-tint);color:var(--alert)}
.stat .ico.g{background:var(--done-tint);color:var(--done)}
.stat h2{font-size:21px;margin:0}
.stat p{margin:2px 0 0;color:var(--mute);font-size:16px}

/* CONTEXTO */
.opt{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--surf);border-radius:14px;padding:4px}
.opt button{min-height:52px;border:0;border-radius:11px;background:transparent;font-weight:800;font-size:17px;color:var(--mute);cursor:pointer}
.opt button small{display:block;font-size:13px;font-weight:500}
.opt button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--sh-sm)}
.opt.bad button[aria-pressed="true"]{color:var(--warn)}
.note{display:flex;gap:var(--s2);align-items:flex-start;border-radius:12px;padding:10px 12px;font-size:15px;margin-top:var(--s2)}
.note svg{width:20px;height:20px;margin-top:1px}
.note.w{background:var(--warn-tint);color:var(--warn);font-weight:700}
.note.a{background:var(--alert-tint);color:var(--alert);font-weight:700}
.note.i{background:var(--surf);color:var(--mute)}
.evrow{display:flex;align-items:center;gap:var(--s2);padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.evrow:first-child{border-top:0}
.evrow .d{flex:0 0 72px;font-weight:800;font-size:16px}
.add{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 12px;border-radius:12px;border:2px dashed var(--line);background:none;font-weight:700;font-size:15px;color:var(--mute);cursor:pointer}
.add svg{width:18px;height:18px}
.win{display:grid;grid-template-columns:64px repeat(3,1fr);gap:4px;align-items:center}
.win .h{font-size:13px;font-weight:800;color:var(--mute);text-align:center}
.win .d{font-size:15px;font-weight:800}
.win button{min-height:44px;border-radius:10px;border:2px solid var(--line);background:var(--card);cursor:pointer;font-size:14px;font-weight:700;color:var(--mute)}
.win button[aria-pressed="true"]{background:var(--done);border-color:var(--done);color:#fff}

/* REVISAR */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:var(--z-dock);padding:8px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(0deg,var(--bg) 70%,rgba(244,245,248,0))}
.dock .in{max-width:536px;margin:0 auto;background:var(--card);border:2px solid var(--ink);border-radius:var(--r);padding:var(--s3);box-shadow:var(--sh-lg)}
.dock .sum{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:var(--s2);font-size:15px;font-weight:700}
.dock .sum>span{flex:1;min-width:0}
.dock .sum>svg{width:18px;height:18px}
.chk{list-style:none;margin:0;padding:0}
.chk li{display:flex;gap:var(--s2);padding:9px 0;border-top:1px solid var(--line);font-size:15px;align-items:flex-start}
.chk li:first-child{border-top:0}
.chk .s{flex:0 0 72px}
.chk small{display:block;color:var(--mute)}
.cand{display:flex;align-items:center;gap:var(--s3);width:100%;text-align:left;min-height:64px;border:2px solid var(--line);border-radius:14px;background:var(--card);padding:10px 12px;cursor:pointer;margin-top:6px}
.cand .grow b{display:block;font-size:17px;line-height:1.2}
.cand .tm{font-size:20px;font-weight:800;white-space:nowrap}
.cand.cur{border-color:var(--now);background:var(--now-tint)}
.prep{display:flex;gap:var(--s3);align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.prep:first-child{border-top:0}
.prep .grow b{display:block;font-size:17px;line-height:1.25}
.prep .grow small{display:block;font-size:14px;color:var(--mute)}
.when-sel{min-height:44px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:16px;padding:0 10px}
.injan{display:inline-flex;align-items:center;gap:4px;color:var(--done);font-weight:800;font-size:13px}
.injan svg{width:15px;height:15px}

/* ENTREGAS */
.deliv{display:flex;align-items:center;gap:var(--s3);background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:var(--s3);text-decoration:none;color:var(--ink);box-shadow:var(--sh-sm);min-height:76px}
.deliv+.deliv{margin-top:var(--s2)}
.deliv .ico{flex:0 0 52px;height:52px;border-radius:15px;display:grid;place-items:center;color:#fff}
.deliv b{display:block;font-size:18px}
.deliv small{display:block;font-size:15px;color:var(--mute);margin-top:2px}
.msg{background:var(--surf);border-radius:14px;padding:var(--s3);font-size:15px;white-space:pre-wrap;line-height:1.45;max-height:220px;overflow:auto}

/* COMPRAS */
.stores{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:4px;background:var(--surf);border-radius:14px;padding:4px;position:sticky;top:0;z-index:var(--z-sticky)}
.stores a{min-height:56px;border-radius:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;color:var(--mute);font-weight:800;font-size:16px;line-height:1.15;text-align:center}
.stores a small{font-weight:500;font-size:13px}
.stores a[aria-current="page"]{background:var(--card);color:var(--ink);box-shadow:var(--sh-sm)}
.progress{display:flex;align-items:center;gap:var(--s3);margin:var(--s4) 0 var(--s2);font-size:15px;color:var(--mute);font-weight:700}
.progress .track{flex:1;height:10px;border-radius:5px;background:var(--surf);overflow:hidden}
.progress .fill{display:block;height:100%;width:100%;background:var(--done);transform-origin:left;transition:transform .25s var(--ease)}
.sector{font-size:15px;font-weight:800;color:var(--mute);margin:var(--s5) 0 var(--s2)}
.buy{display:flex;align-items:center;gap:var(--s3);width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;box-shadow:var(--sh-sm)}
.buy+.buy{margin-top:6px}
.buy .pt{display:block;font-size:18px;font-weight:700;line-height:1.2}
.buy .fr{display:block;font-size:15px;color:var(--mute);font-style:italic}
.buy .uso{display:block;font-size:14px;color:var(--mute);margin-top:2px}
.buy .q{text-align:right;font-weight:800;font-size:19px;white-space:nowrap}
.buy .q small{display:block;font-size:14px;font-weight:700;color:var(--mute)}
.buy .q small.nd{color:var(--alert)}
.buy[aria-checked="true"] .pt{text-decoration:line-through;color:var(--mute)}
.buy[aria-checked="true"]{background:var(--surf);box-shadow:none}
.sem{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:800;border-radius:999px;padding:0 8px;line-height:22px;margin-top:4px;white-space:nowrap}
.sem.pd{background:var(--surf);color:var(--mute)}
.sem.v{background:var(--done-tint);color:var(--done)}
.sem.y{background:var(--alert-tint);color:var(--alert)}
.sem.r{background:var(--warn-tint);color:var(--warn)}
.sem::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.sem.pd::before{background:transparent;border:2px solid currentColor;width:8px;height:8px}
details.more{margin-top:var(--s3);background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
details.more summary{list-style:none;min-height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 var(--s4);font-weight:800;cursor:pointer}
details.more summary::-webkit-details-marker{display:none}
details.more ul{list-style:none;margin:0;padding:0 var(--s4) var(--s3);font-size:16px}
details.more li{padding:8px 0;border-top:1px solid var(--line)}
details.more li small{display:block;color:var(--mute);font-style:italic}
.tot{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s3);margin-top:var(--s4)}
.tot b{font-size:26px;font-weight:800}

/* LIVRO */
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 12px;min-height:52px;box-shadow:var(--sh-sm)}
.search input{flex:1;border:0;background:transparent;font-size:17px;min-height:48px;outline:none}
.search input::placeholder{color:var(--mute)}
.fil{display:flex;gap:6px;overflow-x:auto;padding:var(--s3) 0 var(--s2);scrollbar-width:none}
.fil::-webkit-scrollbar{display:none}
.fbt{flex:0 0 auto;min-height:44px;padding:0 14px;border-radius:999px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:15px;cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.fbt[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.rec{display:flex;gap:var(--s3);align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px;text-decoration:none;color:var(--ink);box-shadow:var(--sh-sm);min-height:84px}
.rec+.rec{margin-top:var(--s2)}
.thumb{flex:0 0 64px;height:64px;border-radius:14px;background:var(--c,var(--t-livre));display:grid;place-items:center;color:#fff}
.thumb svg{width:30px;height:30px;stroke-width:1.8}
.rec b{display:block;font-size:17px;line-height:1.22}
.rec .tags{margin-top:6px}
.rec .tm{font-size:15px;font-weight:800;color:var(--mute);white-space:nowrap;align-self:flex-start}
.queue{display:flex;align-items:center;gap:var(--s3);background:var(--t-leg-bg);border-radius:var(--r);padding:var(--s3);text-decoration:none;color:var(--t-leg-tx)}
.queue .n{flex:0 0 48px;height:48px;border-radius:50%;background:var(--t-leg);color:#fff;display:grid;place-items:center;font-weight:800;font-size:21px}
.queue b{display:block;font-size:17px}
.hero{height:150px;border-radius:var(--r);background:var(--c);display:flex;align-items:flex-end;justify-content:space-between;padding:var(--s3);color:#fff;margin-top:var(--s2)}
.hero svg{width:46px;height:46px;stroke-width:1.6;opacity:.9}
.hero .ph{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border-radius:12px;background:rgba(0,0,0,.22);color:#fff;font-weight:700;font-size:15px;border:0;cursor:pointer}
.hero .ph svg{width:18px;height:18px;opacity:1}
.stp{list-style:none;padding:0;margin:0;counter-reset:s}
.stp li{counter-increment:s;display:grid;grid-template-columns:40px 1fr;gap:var(--s3);padding:var(--s3) 0;border-top:1px solid var(--line);font-size:17px}
.stp li:first-child{border-top:0}
.stp li::before{content:counter(s);width:40px;height:40px;border-radius:50%;background:var(--now-tint);color:var(--now);font-weight:800;display:grid;place-items:center;font-size:19px}
.stp .tmr{display:inline-flex;align-items:center;gap:6px;margin-top:8px;min-height:44px;padding:0 12px;border-radius:12px;border:2px solid var(--now);background:var(--card);color:var(--now);font-weight:800;font-size:15px;cursor:pointer}
.stp .tmr svg{width:18px;height:18px}
.qitem{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:var(--s3);box-shadow:var(--sh-sm)}
.qitem+.qitem{margin-top:var(--s3)}
.qitem .src{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--mute);font-weight:700;margin-top:4px}
.qitem .src svg{width:16px;height:16px}

/* FECHAMENTO */
.vote{display:flex;align-items:center;gap:var(--s2);padding:10px 0;border-top:1px solid var(--line)}
.vote:first-child{border-top:0}
.vote .grow b{display:block;font-size:16px;line-height:1.25}
.vbt{display:grid;place-items:center;width:52px;height:52px;border-radius:14px;border:2px solid var(--line);background:var(--card);cursor:pointer;color:var(--mute)}
.vbt svg{width:24px;height:24px}
.vbt.up[aria-pressed="true"]{background:var(--done);border-color:var(--done);color:#fff}
.vbt.down[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:#fff}
.sobra{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border-radius:999px;border:2px solid var(--line);background:var(--card);font-weight:700;font-size:15px;cursor:pointer}
.sobra[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}

/* ARQUIVO */
.wkc{display:block;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:var(--s3) var(--s4);text-decoration:none;color:var(--ink);box-shadow:var(--sh-sm)}
.wkc+.wkc{margin-top:var(--s2)}
.wkc .top2{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s2)}
.wkc b{font-size:18px}
.stripe{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin:10px 0 6px}
.stripe span{height:22px;border-radius:6px;background:var(--c,var(--t-livre-bg))}
.stripe span.lv{background:repeating-linear-gradient(135deg,var(--surf) 0 5px,#E2E5EC 5px 10px)}

/* MAIS */
.menu a{display:flex;align-items:center;gap:var(--s3);min-height:64px;padding:0 var(--s2);border-top:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:18px;font-weight:700}
.menu a:first-child{border-top:0}
.menu a .ico{flex:0 0 40px;height:40px;border-radius:12px;background:var(--surf);display:grid;place-items:center;color:var(--ink)}
.menu a .grow small{display:block;font-size:14px;color:var(--mute);font-weight:500}

/* ENTRAR */
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:var(--s6) 0}
.brand{display:flex;align-items:center;gap:var(--s3)}
.brand .mk{width:64px;height:64px;border-radius:18px;background:var(--now);display:grid;place-items:center;color:#fff}
.brand .mk svg{width:36px;height:36px}
.login h1{font-size:34px;line-height:1.08;margin:var(--s5) 0 var(--s2);letter-spacing:-.02em}
.login .lead{font-size:18px;color:var(--mute);margin:0 0 var(--s6)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:60px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:19px;font-weight:800;cursor:pointer;box-shadow:var(--sh-sm);color:var(--ink);text-decoration:none}
.gbtn svg{width:24px;height:24px}
.stripe-hero{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:var(--s5)}
.stripe-hero span{height:44px;border-radius:12px;background:var(--c)}

.empty{text-align:center;padding:var(--s7) var(--s3)}
.empty .ico{width:84px;height:84px;border-radius:26px;margin:0 auto;background:var(--now-tint);color:var(--now);display:grid;place-items:center}
.empty .ico svg{width:44px;height:44px;stroke-width:1.8}
.empty .ico.w{background:var(--warn-tint);color:var(--warn)}
.empty h2{font-size:24px;margin:var(--s4) 0 var(--s2)}
.empty p{color:var(--mute);margin:0 auto var(--s5);max-width:30ch}
.empty .bt{min-width:240px}
.empty .btrow .bt{min-width:0}

/* ===== rodada 2 (26/09) ===== */
/* M4 grava sozinho: indicador "Salvo 20h14" */
.saved{display:inline-flex;align-items:center;gap:5px;font-size:14px;font-weight:700;color:var(--done);white-space:nowrap}
.saved svg{width:16px;height:16px;stroke-width:2.6}
.saved.busy{color:var(--mute)}
.saved.busy svg{animation:spin 1s linear infinite}
.saved.pl{min-height:44px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--card)}
.flowbar .t .saved{display:flex;margin-top:4px}
.fld{display:block;width:100%;min-height:52px;border-radius:14px;border:2px solid var(--line);background:var(--card);padding:12px;font-size:17px;line-height:1.35;resize:vertical;field-sizing:content;color:var(--ink)}
.fld:focus{border-color:var(--now);outline:none}
.fld::placeholder{color:var(--mute)}
.draft{display:flex;gap:8px;align-items:flex-start;margin-top:8px;font-size:15px;color:var(--mute)}
.draft .saved{flex:0 0 auto}

/* M3 pedido de ajuste por dia */
.day .ctrl.c2{grid-template-columns:1fr 1.3fr}
.cbt.has{border-color:var(--now);background:var(--now-tint);color:var(--now)}
.cbt[disabled]{color:var(--mute);background:var(--surf);border-color:var(--surf);cursor:not-allowed}
.pedbox{margin:0 8px 10px;padding:12px;border-radius:14px;background:var(--now-tint)}
.pedbox>b{display:block;font-size:17px;line-height:1.25}
.pedbox>.small{display:block;margin-top:2px}
.pedbox .atal{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.pedbox .fbt[aria-pressed="true"],.aj-at .fbt[aria-pressed="true"]{background:var(--now);border-color:var(--now);color:var(--now-ink)}
.pedbox .row{min-height:44px}
.pedsum{display:flex;gap:8px;align-items:flex-start;margin:0 12px 12px;font-size:15px;color:var(--now);font-weight:700}
.pedsum svg{width:18px;height:18px;margin-top:2px}
.pedsum.lk{color:var(--ink)}
.pedsem label{display:block;margin-bottom:8px}
.pedsem label b{display:block;font-size:17px}
.full-lnk{display:flex;justify-content:center;width:100%;margin-top:6px;font-size:16px}
.day.mudou{border:2px solid var(--now)}
.day.nao{border:2px solid #E7B35C}
.antes{display:block;font-size:14px;color:var(--mute);margin-top:6px}
.chg{list-style:none;margin:0;padding:0}
.chg li{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:10px 0;border-top:1px solid var(--line);font-size:16px;align-items:start}
.chg li:first-child{border-top:0}
.chg li>.pill{margin-top:1px}
.chg small{display:block;color:var(--mute);font-size:14px;margin-top:2px}
.refaz .grow .sk{height:18px;margin-top:8px}

/* folha da própria página (substitui confirm/alert/prompt do navegador) */
.veil{position:fixed;inset:0;z-index:var(--z-veil);background:rgba(16,22,34,.42)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:var(--z-sheet);max-height:88vh;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));box-shadow:var(--sh-lg)}
.sheet .in{max-width:540px;margin:0 auto}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 14px}
.sheet h2{font-size:22px;line-height:1.2;margin:0 0 6px}
.sheet h3{font-size:16px;margin:16px 0 8px;color:var(--mute)}
.sheet .lead{color:var(--mute);margin:0 0 10px;font-size:16px}
.sheet .stack{display:grid;gap:8px;margin-top:16px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:fup .24s var(--ease)}.veil{animation:fin .2s var(--ease)}}
@keyframes fup{from{transform:translateY(28px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fin{from{opacity:0}to{opacity:1}}

/* M2 fechamento: observação e ajuste */
.vote-b{border-top:1px solid var(--line);padding:2px 0 10px}
.vote-b:first-of-type{border-top:0}
.vote-b .vote{border-top:0}
.opt.dest button{font-size:15px;line-height:1.15;padding:4px 8px}
.vote-b .fld{margin-top:8px;min-height:48px;font-size:16px}
.vote-b .add{margin-top:6px}
.vote-b .note{margin-top:8px}
.aj-at{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

/* M5 livro: foto recortada e compartilhar */
.thumb.foto{background:var(--surf);overflow:hidden}
.thumb.foto svg{width:100%;height:100%;display:block}
.hrow{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3)}
.hrow h2.t{margin-bottom:var(--s3)}
.rec.sel{width:100%;text-align:left;cursor:pointer;font:inherit}
.selbox{flex:0 0 30px;height:30px;border-radius:9px;border:3px solid var(--ink);display:grid;place-items:center;background:var(--card)}
.selbox svg{width:20px;height:20px;stroke:#fff;stroke-width:3.5;opacity:0}
.rec.sel[aria-checked="true"]{border-color:var(--now);box-shadow:0 0 0 1px var(--now)}
.rec.sel[aria-checked="true"] .selbox{background:var(--now);border-color:var(--now)}
.rec.sel[aria-checked="true"] .selbox svg{opacity:1}
.fmt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:76px;padding:12px;border-radius:16px;border:2px solid var(--line);background:var(--card);cursor:pointer;margin-top:8px;font:inherit;color:var(--ink)}
.fmt[aria-checked="true"]{border-color:var(--now);background:var(--now-tint)}
.fmt .fi{flex:0 0 48px;height:48px;border-radius:14px;background:var(--surf);display:grid;place-items:center;color:var(--ink)}
.fmt[aria-checked="true"] .fi{background:var(--now);color:var(--now-ink)}
.fmt b{display:block;font-size:18px}
.fmt small{display:block;font-size:15px;color:var(--mute);margin-top:2px}

/* M6 curadoria: enviar receita */
.env4{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.env4 .inbt{min-height:84px}
.qitem.lendo{border:2px dashed var(--now-soft);box-shadow:none}
.qitem.lendo .stat{border:0;box-shadow:none;padding:0;background:transparent}

.fade{animation:fi .22s var(--ease)}
/* só opacidade: transform no ancestral prende o .dock (position:fixed) ao conteúdo durante a animação */
@keyframes fi{from{opacity:.5}to{opacity:1}}
@media (prefers-reduced-motion:reduce){
  .fade,.sk::after,.sync.busy svg,.saved.busy svg{animation:none}
  .nav a,.bt,.progress .fill,details .chev{transition:none}
}

/* ===== app v2 (A3, fase 1) · acréscimos que o mockup não tinha, na mesma linguagem ===== */
[hidden]{display:none!important}
.topo .saved{display:flex;margin-top:4px}
.menu a,.menu button.mi{display:flex;align-items:center;gap:var(--s3);width:100%;min-height:64px;padding:0 var(--s2);border:0;border-top:1px solid var(--line);background:none;text-align:left;text-decoration:none;color:var(--ink);font-size:18px;font-weight:700;cursor:pointer}
.menu>:first-child{border-top:0}
.menu .ico{flex:0 0 40px;height:40px;border-radius:12px;background:var(--surf);display:grid;place-items:center;color:var(--ink)}
.menu .grow small{display:block;font-size:14px;color:var(--mute);font-weight:500}
/* Config: chave liga/desliga (role=switch) */
.sw-row{display:flex;align-items:center;gap:var(--s3);width:100%;min-height:72px;padding:var(--s2) var(--s2);border:0;background:none;text-align:left;cursor:pointer;color:var(--ink);font:inherit}
.sw-row .grow b{display:block;font-size:18px}
.sw-row .grow small{display:block;font-size:15px;color:var(--mute);margin-top:2px}
.sw{flex:0 0 60px;height:36px;border-radius:999px;background:var(--line);position:relative;transition:background .18s var(--ease)}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:var(--sh-sm);transition:transform .18s var(--ease)}
[aria-checked="true"] .sw{background:var(--done)}
[aria-checked="true"] .sw::after{transform:translateX(24px)}
.kv{display:flex;justify-content:space-between;align-items:baseline;gap:var(--s3);min-height:56px;padding:var(--s2);border-top:1px solid var(--line)}
.kv .l{font-weight:700}
.kv .l small{display:block;font-size:14px;color:var(--mute);font-weight:500}
.kv .v{font-weight:800;font-size:19px;white-space:nowrap}
/* Entrar: o botão do Google renderizado pelo GIS fica dentro do mesmo cartão do mockup */
.gis{display:flex;justify-content:center;align-items:center;min-height:60px;border-radius:14px;border:2px solid var(--line);background:var(--card);box-shadow:var(--sh-sm);padding:6px}
.conta{display:flex;align-items:center;gap:var(--s3);padding:var(--s2)}
.conta .av{flex:0 0 44px;height:44px;border-radius:50%;background:var(--now-tint);color:var(--now);display:grid;place-items:center;font-weight:800}
/* Modo cozinha: vários timers no topo e o fim do timer em alerta */
.tdock button{flex:0 0 auto;display:flex;align-items:center;gap:8px;min-height:48px;padding:0 14px;border-radius:14px;background:var(--now);color:var(--now-ink);border:0;font-weight:800;font-size:16px;cursor:pointer}
.tdock button.end{background:var(--warn)}
.tdock button small{font-weight:500;opacity:.9}
.wake.off{color:var(--mute);background:var(--surf)}
.tl .when.small2{font-size:13px}
.task[aria-busy="true"]{opacity:.7}
.nota-acao{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
@media (prefers-reduced-motion:reduce){.sw,.sw::after{transition:none}}

  // Converte uma quantidade para a base do ingrediente: { g, un } ou null (unidade caseira: vai para a despensa, R18)
  function paraBase(ing, qtd, unidade) {
    if (typeof qtd !== 'number' || isNaN(qtd)) return null;
    switch (unidade) {
      case 'g': case 'ml': return { g: qtd, un: 0 };
      case 'kg': case 'l': return { g: qtd * 1000, un: 0 };
      case 'un': case 'dose': return { g: 0, un: qtd };
      case 'emb':
        if (ing && ing.unidades_por_embalagem && !ing.embalagem_g) return { g: 0, un: qtd * ing.unidades_por_embalagem };
        if (ing && ing.embalagem_g) return { g: qtd * ing.embalagem_g, un: 0 };
        return { g: 0, un: 0, emb: qtd };
      default: return null;
    }
  }
  // total em gramas quando dá para converter unidades; senão mantém unidades à parte
  function consolidar(ing, b) {
    var gpu = ing && ing.gramas_por_unidade;
    if (b.un && gpu) return { g: b.g + b.un * gpu, un: 0, emb: b.emb || 0 };
    return { g: b.g, un: b.un, emb: b.emb || 0 };
  }

  // ---------- Necessidades ----------
  function Acumulador(ix) {
    this.ix = ix; this.mapa = {}; this.ordem = []; this.despensa = []; this.despensaVista = {}; this.avisos = [];
  }
  Acumulador.prototype.somar = function (id, qtd, unidade, uso) {
    var ing = this.ix.ing[id];
    var b = paraBase(ing, qtd, unidade);
    if (!b) { this.paraDespensa(id, null, uso, qtd, unidade); return; }
    if (!this.mapa[id]) { this.mapa[id] = { g: 0, un: 0, emb: 0, usos: [] }; this.ordem.push(id); }
    var n = this.mapa[id];
    n.g += b.g; n.un += b.un; n.emb += (b.emb || 0);
    if (uso && n.usos.indexOf(uso) < 0) n.usos.push(uso);
  };
  Acumulador.prototype.paraDespensa = function (id, nome, uso, qtd, unidade) {
    var chave = id || nome;
    var ing = id ? this.ix.ing[id] : null;
    if (this.despensaVista[chave]) {
      var ex = this.despensaVista[chave];
      if (uso && ex.usos.indexOf(uso) < 0) ex.usos.push(uso);
      return;
    }
    var item = { ingrediente_id: id || null, nome_pt: ing ? ing.nome_pt : (nome || id), nome_fr: ing ? ing.nome_fr : null,
                 usos: uso ? [uso] : [], medida: (qtd !== undefined && qtd !== null ? U.fmtNum(qtd, 2) + ' ' + (MEDIDAS[unidade] || String(unidade || '').replace(/_/g, ' ')) : null) };
    this.despensaVista[chave] = item;
    this.despensa.push(item);
  };

  function idFruta(regras) {
    var itens = regras.cafe.modelos.pao_ovo.geovana;
    for (var i = 0; i < itens.length; i++) if (itens[i].item === 'fruta') return itens[i].ingrediente_id;
    return 'fruta_da_estacao';
  }
  function idAzeite(ix) {
    if (ix.ing.azeite) return 'azeite';
    for (var i = 0; i < ix.ingredientes.length; i++) {
      var x = ix.ingredientes[i];
      if (x.categoria === 'gordura' && /azeite/i.test(x.nome_pt || '')) return x.id;
    }
    return null;
  }

  function necessidades(semana, dados, panelas) {
    var ix = D.indexar(dados), regras = ix.regras;
    var acc = new Acumulador(ix);
    var dias = D.diasDe(semana);
    var fruta = idFruta(regras);

    // 1 · panelas (componentes principais)
    panelas.forEach(function (p) {
      var uso = 'jantar de ' + U.nomeDiaMin(p.data);
      p.componentes.forEach(function (c) {
        acc.somar(c.ingrediente_id, c.gramas_compra, c.unidade === 'un' ? 'un' : 'g', uso);
      });
      // R15 · extras
      p.extras.forEach(function (e) {
        var ingE = ix.ing[e.ingrediente_id];
        // R23: tempero vai para "conferir na despensa", sem quantidade, mesmo com gramas
        if (ingE && ingE.categoria === 'tempero') { acc.paraDespensa(e.ingrediente_id, null, uso); return; }
        // R25: azeite fica só na despensa, mesmo como extra com gramas
        if (e.ingrediente_id === idAzeite(ix)) { acc.paraDespensa(e.ingrediente_id, null, uso); return; }
        if (e.quantidade_total === null) { acc.paraDespensa(e.ingrediente_id, null, uso); return; }
        acc.somar(e.ingrediente_id, e.quantidade_total, e.unidade, uso);
      });
      // R30 · salada verde: 40 g por refeição adulta e 20 g da Julia, além de componentes.folhas (só na lista)
      var salP = PN.idSalada(ix);
      if (salP) {
        var gS = 0;
        p.comensais.forEach(function (r) {
          gS += C.PESSOAS[r.pessoa] && C.PESSOAS[r.pessoa].adulto ? regras.panela.folhas_salada_g_por_refeicao_adulto.g
            : regras.panela.folhas_salada_g_por_refeicao_adulto.g * regras.julia.fator;
        });
        if (gS) acc.somar(salP, gS, 'g', uso);
      }
      // R17 · fruta: 1 un por adulto no jantar e no almoço de sobra desta panela
      var adultos = p.comensais.filter(function (r) { return C.PESSOAS[r.pessoa] && C.PESSOAS[r.pessoa].adulto; }).length;
      if (adultos) acc.somar(fruta, adultos, 'un', 'sobremesa');
      // R18 · azeite e sementes da salada: conferir na despensa, sem quantidade
      acc.paraDespensa(idAzeite(ix), 'azeite extravirgem', 'almoço e jantar');
    });
    // R27 · ingredientes da base (R15 sobre a base), escalados pela fração usada na semana
    PN.basesDaSemana(semana, dados, panelas).forEach(function (b) {
      if (!b.existe || b.fracao === null) return;
      var usos = b.dependentes.map(function (x) { return 'jantar de ' + U.nomeDiaMin(x.data); });
      var uso = usos[0];
      var maisUsos = function (id) { var n = acc.mapa[id]; if (n) usos.forEach(function (u) { if (n.usos.indexOf(u) < 0) n.usos.push(u); }); };
      (b.receita.extras || []).forEach(function (e) {
        var ingE = ix.ing[e.ingrediente_id];
        if ((ingE && ingE.categoria === 'tempero') || e.ingrediente_id === idAzeite(ix)) { acc.paraDespensa(e.ingrediente_id, null, uso); return; }
        if (typeof e.quantidade !== 'number') { acc.paraDespensa(e.ingrediente_id, null, uso); return; }
        var mult = e.por === 'porcao' ? b.porcoes_equivalentes : b.fracao;
        acc.somar(e.ingrediente_id, U.arred(e.quantidade * mult, 4), e.unidade, uso);
        maisUsos(e.ingrediente_id);
      });
    });
    if (panelas.length) acc.paraDespensa(null, 'sementes para a salada', 'almoço e jantar');
    // R17 e R30 · jantar livre também é jantar comido: 1 fruta por adulto e a salada verde (40 g adulto, 20 g Julia)
    var salada = PN.idSalada(ix);
    var gSal = regras.panela.folhas_salada_g_por_refeicao_adulto.g;
    dias.forEach(function (d) {
      var j = D.jantarDe(d.dia);
      if (!j.livre) return;
      var ad = (j.comensais || []).filter(function (p) { return C.PESSOAS[p] && C.PESSOAS[p].adulto; }).length;
      if (ad) acc.somar(fruta, ad, 'un', 'sobremesa');
      if (!salada) return;
      var g = 0;
      (j.comensais || []).forEach(function (p) { g += C.PESSOAS[p] && C.PESSOAS[p].adulto ? gSal : gSal * regras.julia.fator; });
      if (g) acc.somar(salada, g, 'g', 'jantar de ' + U.nomeDiaMin(d.data));
    });

    // 2 · cafés (R11, R20: os dois adultos todo dia)
    dias.forEach(function (d) {
      var modelo = d.dia.cafe && regras.cafe.modelos[d.dia.cafe];
      if (!modelo) return;
      C.ADULTOS.forEach(function (pessoa) {
        (modelo[pessoa] || []).forEach(function (it) {
          if (!it.ingrediente_id) return;
          if (typeof it.g === 'number') acc.somar(it.ingrediente_id, it.g, 'g', 'café da manhã');
          else if (typeof it.un === 'number') acc.somar(it.ingrediente_id, it.un, 'un', 'café da manhã');
          else acc.paraDespensa(it.ingrediente_id, it.item, 'café da manhã'); // R18: queijo para passar
        });
      });
    });

    // 3 · lanche da tarde dos adultos (R11): escolha x 2 + fruta 100 g x 2
    var lta = regras.lanche_tarde_adultos;
    dias.forEach(function (d) {
      var lt = d.dia.lanche_tarde || {};
      if (!lt.adultos) return;
      var esc = D.escolhaAdultos(lt.adultos, ix);
      if (!esc) { acc.avisos.push(U.nomeDiaMin(d.data) + ': lanche dos adultos "' + lt.adultos + '" não reconhecido, não entrou na lista.'); return; }
      if (typeof esc.g === 'number') acc.somar(esc.ingrediente_id, esc.g * 2, 'g', 'lanche da tarde');
      else if (typeof esc.dose === 'number') acc.somar(esc.ingrediente_id, esc.dose * 2, 'dose', 'lanche da tarde');
      acc.somar(lta.base.ingrediente_id, lta.base.g * 2, 'g', 'lanche da tarde');
    });

    // 4 · lanche da Julia (R21, R32): quantidade_semana vale 5 usos; lanche usado em N dias soma x N / 5
    var usosLanche = {}, ordemLanche = [];
    dias.forEach(function (d) {
      var id = d.dia.lanche_tarde && d.dia.lanche_tarde.julia;
      if (!id) return;
      if (!usosLanche[id]) { usosLanche[id] = 0; ordemLanche.push(id); }
      usosLanche[id]++;
    });
    ordemLanche.forEach(function (id) {
      var fatorUso = usosLanche[id] / USOS_POR_QUANTIDADE_SEMANA;
      var lan = ix.lan[id];
      if (!lan) return;
      if (lan.regra_ref) return; // R22: lanche dos adultos já somado pela R11
      var algum = false;
      (lan.itens || []).forEach(function (it) {
        if (it && it.ingrediente_id && typeof it.quantidade_semana === 'number') {
          acc.somar(it.ingrediente_id, U.arred(it.quantidade_semana * fatorUso, 4), it.unidade || 'g', 'lanche da Julia');
          algum = true;
        }
      });
      if (!algum) acc.avisos.push('Lanche da Julia "' + lan.nome + '": sem quantidade da semana no cadastro, não entrou na lista.');
    });

    return acc;
  }

  // ---------- Estoque ----------
  function estoquePorIngrediente(semana, ix) {
    var m = {};
    (semana.estoque || []).forEach(function (e) {
      if (!e || !e.ingrediente_id) return;
      var ing = ix.ing[e.ingrediente_id];
      var b = paraBase(ing, e.quantidade, e.unidade);
      if (!b) return;
      b = consolidar(ing, b);
      if (!m[e.ingrediente_id]) m[e.ingrediente_id] = { g: 0, un: 0, emb: 0, locais: [], certezas: [], linhas: [] };
      var x = m[e.ingrediente_id];
      x.g += b.g; x.un += b.un; x.emb += b.emb;
      if (x.locais.indexOf(e.local) < 0) x.locais.push(e.local);
      if (x.certezas.indexOf(e.certeza) < 0) x.certezas.push(e.certeza);
      x.linhas.push(e);
    });
    return m;
  }

  // Descongelar (R13): aloca o estoque do CONGELADOR às panelas em ordem de data.
  // Devolve { <data>: { ingrediente_id, gramas, unidades } } com o que sai do congelador para aquele jantar.
  function alocarCongelador(semana, dados, panelas) {
    var ix = D.indexar(dados);
    var saldo = {};
    (semana.estoque || []).forEach(function (e) {
      if (!e || e.local !== 'congelador') return;
      var ing = ix.ing[e.ingrediente_id];
      var b = paraBase(ing, e.quantidade, e.unidade);
      if (!b) return;
      b = consolidar(ing, b);
      saldo[e.ingrediente_id] = saldo[e.ingrediente_id] || { g: 0, un: 0 };
      saldo[e.ingrediente_id].g += b.g; saldo[e.ingrediente_id].un += b.un;
    });
    var out = {};
    panelas.slice().sort(function (a, b) { return a.data < b.data ? -1 : 1; }).forEach(function (p) {
      p.componentes.forEach(function (c) {
        if (c.componente !== 'proteina') return;
        var ing = ix.ing[c.ingrediente_id];
        if (!ing || ing.congela !== true) return;
        var s = saldo[c.ingrediente_id];
        if (!s) return;
        var campo = c.unidade === 'un' ? 'un' : 'g';
        var usado = Math.min(s[campo], c.gramas_compra);
        if (usado <= 0) return;
        s[campo] = U.arred(s[campo] - usado, 4);
        out[p.data] = { ingrediente_id: c.ingrediente_id, gramas: campo === 'g' ? U.arred(usado, 4) : null,
                        unidades: campo === 'un' ? usado : (ing.gramas_por_unidade ? U.arred(usado / ing.gramas_por_unidade, 2) : null),
                        cobre_tudo: usado >= c.gramas_compra - 1e-9 };
      });
    });
    return out;
  }

  // ---------- Quantidade de compra (R10) ----------
  function quantidadeCompra(ing, liq) {
    // liq = { g, un } já líquido de estoque, > 0
    var uc = ing.unidade_compra;
    if (liq.un > 0 && liq.g > 0) return { qtd: null, unidade: uc, aviso: 'mistura de gramas e unidades sem gramas_por_unidade' };
    if (uc === 'kg') {
      if (liq.g > 0) return { qtd: U.arred(U.tetoMultiplo(liq.g / 1000, 0.1), 1), unidade: 'kg' };
      return { qtd: null, unidade: 'kg', aviso: 'necessidade em unidades e compra em kg, sem gramas_por_unidade' };
    }
    if (uc === 'l') {
      if (liq.g > 0) return { qtd: U.arred(U.tetoMultiplo(liq.g / 1000, 0.1), 1), unidade: 'l' };
    }
    if (uc === 'emb') {
      if (ing.unidades_por_embalagem && liq.un_puro > 0) return { qtd: Math.ceil(U.arred(liq.un_puro / ing.unidades_por_embalagem, 6) - 1e-9), unidade: 'emb' };
      if (ing.embalagem_g && liq.g > 0) return { qtd: Math.ceil(U.arred(liq.g / ing.embalagem_g, 6) - 1e-9), unidade: 'emb' };
      if (liq.emb > 0) return { qtd: Math.ceil(liq.emb - 1e-9), unidade: 'emb' };
      return { qtd: null, unidade: 'emb', aviso: 'sem tamanho de embalagem (embalagem_g) no catálogo' };
    }
    if (uc === 'un') {
      if (liq.un > 0) return { qtd: Math.ceil(U.arred(liq.un, 6) - 1e-9), unidade: 'un' };
      if (ing.gramas_por_unidade && liq.g > 0) return { qtd: Math.ceil(U.arred(liq.g / ing.gramas_por_unidade, 6) - 1e-9), unidade: 'un' };
      return { qtd: null, unidade: 'un', aviso: 'compra por unidade sem gramas_por_unidade' };
    }
    if (uc === 'g' || uc === 'ml') {
      if (liq.g > 0) return { qtd: Math.ceil(U.arred(liq.g, 6) - 1e-9), unidade: uc };
    }
    return { qtd: null, unidade: uc, aviso: 'unidade de compra "' + uc + '" sem conversão' };
  }

  function custo(ing, qtd, unidade) {
    if (typeof ing.preco_eur !== 'number' || qtd === null) return null;
    var por = ing.preco_por || unidade;
    var kgDe = function () {
      if (unidade === 'kg' || unidade === 'l') return qtd;
      if (unidade === 'g' || unidade === 'ml') return qtd / 1000;
      if (unidade === 'emb' && ing.embalagem_g) return qtd * ing.embalagem_g / 1000;
      if (unidade === 'un' && ing.gramas_por_unidade) return qtd * ing.gramas_por_unidade / 1000;
      return null;
    };
    var k;
    if (por === 'kg' || por === 'l') { k = kgDe(); return k === null ? null : U.arred(ing.preco_eur * k, 2); }
    if (por === '100g') { k = kgDe(); return k === null ? null : U.arred(ing.preco_eur * k * 10, 2); }
    if (por === unidade) return U.arred(ing.preco_eur * qtd, 2);
    if (por === 'un' && unidade === 'emb' && ing.embalagem_g && ing.gramas_por_unidade) {
      return U.arred(ing.preco_eur * qtd * ing.embalagem_g / ing.gramas_por_unidade, 2);
    }
    return null;
  }

  function textoEstoque(e, ing) {
    var partes = [];
    if (e.g > 0) partes.push(U.fmtG(e.g, { kg: true }));
    if (e.un > 0) partes.push(U.fmtNum(e.un, 2) + ' un');
    if (e.emb > 0) partes.push(U.fmtNum(e.emb, 2) + ' emb');
    return (ing ? ing.nome_pt : '') + ' ' + partes.join(' + ') + ' (' + e.locais.join(', ') + ')';
  }

  // API_MOTOR.gerarListaCompras(semana, dados) -> ListaCompras
  function gerarListaCompras(semana, dados, panelasPre) {
    var ix = D.indexar(dados);
    var panelas = panelasPre || PN.calcularPanela(semana, dados);
    var acc = necessidades(semana, dados, panelas);
    var estoque = estoquePorIngrediente(semana, ix);
    var itens = [], jaTenho = [], avisos = acc.avisos.slice();

    acc.ordem.forEach(function (id) {
      var ing = ix.ing[id];
      var n = acc.mapa[id];
      if (!ing) { avisos.push('Ingrediente "' + id + '" não existe no catálogo: não entrou na lista.'); return; }
      var nec = consolidar(ing, n);
      var est = estoque[id] ? { g: estoque[id].g, un: estoque[id].un, emb: estoque[id].emb } : { g: 0, un: 0, emb: 0 };
      if (est.un && ing.gramas_por_unidade) { est.g += est.un * ing.gramas_por_unidade; est.un = 0; }
      var usadoG = Math.min(est.g, nec.g), usadoUn = Math.min(est.un, nec.un), usadoEmb = Math.min(est.emb, nec.emb);
      var liq = { g: U.arred(nec.g - usadoG, 4), un: U.arred(nec.un - usadoUn, 4), emb: U.arred(nec.emb - usadoEmb, 4) };
      // necessidade só em unidades (ex.: ovos) com unidades_por_embalagem: compra por caixa de N, não por peso
      if (ing.unidades_por_embalagem && n.g === 0 && n.un > 0) {
        var gpuL = ing.gramas_por_unidade;
        liq.un_puro = gpuL ? U.arred(liq.g / gpuL, 4) : liq.un;
      }
      var usoTxt = U.juntar(n.usos);
      var basePorUn = nec.g === 0 && nec.un > 0;
      var usado = basePorUn ? usadoUn : usadoG;
      if (estoque[id] && estoque[id].certezas.indexOf('provavel') >= 0 && usado > 0) {
        avisos.push(ing.nome_pt + ': o estoque descontado está marcado como provável. Conferir antes de fechar a compra.');
      }
      if (liq.g <= 0 && liq.un <= 0 && liq.emb <= 0) {
        // R19: coberto pelo estoque, só em "já tenho"
        jaTenho.push({ ingrediente_id: id, nome_pt: ing.nome_pt, nome_fr: ing.nome_fr,
          local: estoque[id].locais[0], locais: estoque[id].locais, certeza: estoque[id].certezas.join(', '),
          gramas_necessarias: U.arred(nec.g, 4), unidades_necessarias: n.un ? U.arred(n.un, 4) : null,
          ja_tenho: U.arred(usado, 4), uso_previsto: usoTxt,
          texto: U.semTravessao(textoEstoque(estoque[id], ing) + ', cobre: ' + usoTxt) });
        return;
      }
      var q = quantidadeCompra(ing, liq);
      if (q.aviso) avisos.push(ing.nome_pt + ': ' + q.aviso + '. Conferir a quantidade.');
      var ce = custo(ing, q.qtd, q.unidade);
      itens.push({
        ingrediente_id: id, nome_pt: ing.nome_pt, nome_fr: ing.nome_fr, loja: ing.loja, setor: ing.setor,
        gramas_necessarias: U.arred(nec.g, 4), unidades_necessarias: n.un ? U.arred(n.un, 4) : null,
        quantidade_compra: q.qtd, unidade_compra: q.unidade,
        ja_tenho: U.arred(usado, 4), uso_previsto: U.semTravessao(usoTxt),
        custo_estimado_eur: ce, preco_fonte: ce === null ? null : (ing.preco_fonte || null),
        texto: U.semTravessao(ing.nome_pt + ' (' + ing.nome_fr + '): ' + U.fmtQtdCompra(q.qtd, q.unidade) + ', para ' + usoTxt)
      });
    });

    // R29: sem pedido do Pedrosa, proteína animal de lá vai para o Mon Marché (preço de referência do Pedrosa não vale);
    // o resto que só o Pedrosa vende fica na lista dele com alerta "só no Pedrosa".
    var soPedrosa = [];
    if (!semana.pedido_pedrosa) {
      itens.forEach(function (it) {
        if (it.loja !== 'pedrosa') return;
        var ingP = ix.ing[it.ingrediente_id];
        if (ingP && ingP.categoria === 'proteina_animal') {
          it.loja_original = 'pedrosa'; it.loja = 'mon_marche';
          it.custo_estimado_eur = null; it.preco_fonte = null;
        } else {
          it.so_pedrosa = true;
          soPedrosa.push(it.nome_pt);
        }
      });
    }

    // ordem de exibição: loja (ordem do contrato) -> setor (ordem do contrato) -> nome
    var ordemLoja = Object.keys(C.LOJAS);
    itens.sort(function (a, b) {
      var la = ordemLoja.indexOf(a.loja), lb = ordemLoja.indexOf(b.loja);
      if (la !== lb) return (la < 0 ? 99 : la) - (lb < 0 ? 99 : lb);
      var sa = C.SETORES.indexOf(a.setor), sb = C.SETORES.indexOf(b.setor);
      if (sa !== sb) return (sa < 0 ? 99 : sa) - (sb < 0 ? 99 : sb);
      return a.nome_pt < b.nome_pt ? -1 : a.nome_pt > b.nome_pt ? 1 : 0;
    });

    // custo por loja + cobertura de preço
    var custoPorLoja = {}, detalhe = {}, comPreco = 0;
    itens.forEach(function (it) {
      var dl = detalhe[it.loja] = detalhe[it.loja] || { subtotal_eur: 0, itens: 0, itens_com_preco: 0 };

/* ===== app/dados/idb.js ===== */
/* app/dados/idb.js · cópia local no IndexedDB (CONTRATO §12, SPEC §4).
 * Três depósitos:
 *   base : { aba -> {aba, versao, linhas} }  a última cópia que a PLANILHA mandou (nunca editada pelo aparelho)
 *   fila : { op_id -> {op_id, seq, op, enviada, tentativas} }  cada op é um registro próprio: gravar ou apagar
 *          uma op nunca regrava a fila inteira (ref 08 §6.2: nada lido antes de um await volta inteiro)
 *   kv   : chave/valor do aparelho (token, pessoa, hora da última sincronia)
 * Se o IndexedDB não abrir (aba privada, webview sem armazenamento), cai para memória e avisa: App.idb.persistente = false.
 * Sem template literal (crase).
 */
(function (root) {
  'use strict';
  var App = root.App = root.App || {};
  var LOJAS = ['base', 'fila', 'kv'];
  var db = null, mem = null;

  function req2p(r) { return new Promise(function (ok, err) { r.onsuccess = function () { ok(r.result); }; r.onerror = function () { err(r.error); }; }); }

  function abrir(nome) {
    return new Promise(function (ok) {
      var feito = false;
      function memoria(motivo) {
        if (feito) return; feito = true;
        mem = { base: {}, fila: {}, kv: {} };
        App.idb.persistente = false; App.idb.motivo = String(motivo || 'sem IndexedDB');
        ok(false);
      }
      try {
        if (!root.indexedDB) return memoria('sem IndexedDB');
        var r = root.indexedDB.open(nome, 1);
        r.onupgradeneeded = function () {
          var d = r.result;
          LOJAS.forEach(function (s) { if (!d.objectStoreNames.contains(s)) d.createObjectStore(s); });
        };
        r.onsuccess = function () { if (feito) return; feito = true; db = r.result; App.idb.persistente = true; ok(true); };
        r.onerror = function () { memoria(r.error); };
        r.onblocked = function () { memoria('bloqueado'); };
        setTimeout(function () { memoria('tempo esgotado ao abrir'); }, 4000);
      } catch (e) { memoria(e); }
    });
  }

  function tx(loja, modo, fn) {
    if (mem) return Promise.resolve(fn(null, mem[loja]));
    return new Promise(function (ok, err) {
      var t = db.transaction(loja, modo), st = t.objectStore(loja), res;
      Promise.resolve(fn(st, null)).then(function (v) { res = v; });
      t.oncomplete = function () { ok(res); };
      t.onerror = function () { err(t.error); };
      t.onabort = function () { err(t.error || new Error('transação abortada')); };
    });
  }
  function ler(loja, chave) {
    return tx(loja, 'readonly', function (st, m) { return m ? App.base.copia(m[chave]) : req2p(st.get(chave)); });
  }
  function gravar(loja, chave, valor) {
    return tx(loja, 'readwrite', function (st, m) { if (m) { m[chave] = App.base.copia(valor); return; } st.put(valor, chave); });
  }
  function apagar(loja, chave) {
    return tx(loja, 'readwrite', function (st, m) { if (m) { delete m[chave]; return; } st.delete(chave); });
  }
  function todos(loja) {
    return tx(loja, 'readonly', function (st, m) {
      if (m) return Object.keys(m).map(function (k) { return App.base.copia(m[k]); });
      return req2p(st.getAll());
    });
  }
  function limparTudo() {
    return Promise.all(LOJAS.map(function (l) {
      return tx(l, 'readwrite', function (st, m) { if (m) { Object.keys(m).forEach(function (k) { delete m[k]; }); return; } st.clear(); });
    }));
  }

  App.idb = { abrir: abrir, ler: ler, gravar: gravar, apagar: apagar, todos: todos, limparTudo: limparTudo, persistente: null, motivo: null };
})(this);

/* ===== app/dados/ops.js ===== */
/* app/dados/ops.js · o que cada op (CONTRATO.OPS) faz nas abas (CONTRATO.ABAS), escrito UMA vez e usado em dois lugares:
 *   - no aparelho: a cópia local = base da planilha + ops da fila reaplicadas por cima (sem checar conflito);
 *   - no servidor falso (?api=falsa): com idempotência por op_id, conflito por caminho e transições (CONTRATO §12, R39).
 * O servidor de verdade é o gas/Api.gs (A1). Este arquivo não o substitui; ele é a regra do aparelho e do teste.
 * Linhas são objetos por cabeçalho. A coluna json pode chegar como texto (planilha) ou objeto: preservamos o tipo.
 * Sem template literal (crase).
 */
(function (root) {
  'use strict';
  var App = root.App = root.App || {};
  var C = root.CONTRATO;
  var B = function () { return App.base; };

  function aba(abas, nome) { return abas[nome] || (abas[nome] = { aba: nome, versao: 0, linhas: [] }); }
  function acharIdx(linhas, campo, valor) { for (var i = 0; i < linhas.length; i++) if (String(linhas[i][campo]) === String(valor)) return i; return -1; }
  function lerJson(v) { return B().json(v, null); }
  function gravarJson(original, obj) { return typeof original === 'string' || original == null ? JSON.stringify(obj) : obj; }
  function getCaminho(o, caminho) {
    var p = String(caminho).split('.');
    for (var i = 0; i < p.length; i++) { if (o == null) return undefined; o = o[p[i]]; }
    return o;
  }
  function setCaminho(o, caminho, valor) {
    var p = String(caminho).split('.');
    for (var i = 0; i < p.length - 1; i++) {
      var k = p[i], prox = p[i + 1];
      if (o[k] == null || typeof o[k] !== 'object') o[k] = /^\d+$/.test(prox) ? [] : {};
      o = o[k];
    }
    if (valor === undefined) delete o[p[p.length - 1]]; else o[p[p.length - 1]] = valor;
  }
  function igual(a, b) { return JSON.stringify(a === undefined ? null : a) === JSON.stringify(b === undefined ? null : b); }
  function erro(op, codigo, msg) { return { op_id: op.op_id, ok: false, erro: { codigo: codigo, mensagem: msg } }; }

  // ctx = { pessoa, agora (ISO), servidor: bool }  ·  devolve { op_id, ok, conflito?, versao?, erro? }
  function aplicarOp(abas, op, ctx) {
    var d = op.dados || {}, em = ctx.agora, por = ctx.pessoa || 'aparelho';
    if (!C.OPS[op.tipo]) return erro(op, 'entrada_invalida', 'tipo de op desconhecido: ' + op.tipo);
    var alvo = C.OPS[op.tipo].alvo, A = aba(abas, alvo), L = A.linhas, i, r;
    var mexeu = true, res = { op_id: op.op_id, ok: true };

    switch (op.tipo) {
      case 'semana_criar':
        i = acharIdx(L, 'inicio', d.inicio);
        if (i >= 0) { if (ctx.servidor) return { op_id: op.op_id, ok: false, conflito: { caminho: '', valor: lerJson(L[i].json) }, erro: { codigo: 'conflito', mensagem: 'a semana já existe na planilha' } }; mexeu = false; break; }
        var sem = B().copia(d.semana || {});
        sem.estado = sem.estado || 'estoque';
        L.push({ inicio: d.inicio, estado: sem.estado, aprovada_em: '', aprovada_por: '', versao: 1, json: JSON.stringify(sem), versoes_json: '{}', atualizado_em: em, por: por });
        res.versao = 1;
        break;

      case 'semana_patch':
        i = acharIdx(L, 'inicio', d.inicio);
        if (i < 0) return erro(op, 'entrada_invalida', 'semana ' + d.inicio + ' não existe');
        r = L[i];
        var s = lerJson(r.json) || {}, vers = lerJson(r.versoes_json) || {}, atual = getCaminho(s, d.caminho);
        if (ctx.servidor) {
          // imita gas/Sincronia.gs (opSemanaPatch_): caminhos de estado só mudam por semana_estado; propostas_usadas só +1 até o teto

            var usadasP = Number(s.propostas_usadas || 0);

          } else if (['estado', 'aprovada_em', 'aprovada_por', 'inicio', 'propostas_usadas', 'lista_aprovada'].indexOf(seg0) >= 0) {
            return erro(op, 'entrada_invalida', 'o caminho ' + seg0 + ' só muda pela op semana_estado');
          }
          var v = vers[d.caminho];
          // conflito: o caminho mudou depois da versão que o aparelho conhecia, por OUTRA pessoa, e o valor é diferente
          if (v && d.base_versao != null && Number(v.versao) > Number(d.base_versao) && v.por !== por && !igual(atual, d.valor)) {
            return { op_id: op.op_id, ok: false, conflito: { caminho: d.caminho, valor: atual, por: v.por }, versao: Number(r.versao) };
          }

        setCaminho(s, d.caminho, d.valor);
        r.versao = Number(r.versao || 0) + 1;
        vers[d.caminho] = { versao: r.versao, por: por, em: em };
        r.json = gravarJson(r.json, s); r.versoes_json = gravarJson(r.versoes_json, vers);
        r.atualizado_em = em; r.por = por;
        res.versao = r.versao;
        break;

      case 'semana_estado':
        i = acharIdx(L, 'inicio', d.inicio);
        if (i < 0) return erro(op, 'entrada_invalida', 'semana ' + d.inicio + ' não existe');
        r = L[i];
        var s2 = lerJson(r.json) || {};
        if (r.estado === d.para) { res.versao = Number(r.versao); mexeu = false; break; }
        if (ctx.servidor && (r.estado !== d.de || (C.TRANSICOES[d.de] || []).indexOf(d.para) < 0)) {
          return erro(op, 'transicao_invalida', 'de ' + r.estado + ' para ' + d.para + ' não está em TRANSICOES');
        }
        if (d.de === 'em_revisao' && d.para === 'pre_cardapio') {

          if (ctx.servidor && usadas >= C.TETO_PROPOSTAS) return erro(op, 'transicao_invalida', 'as ' + C.TETO_PROPOSTAS + ' propostas já foram usadas');

        }

        r.json = gravarJson(r.json, s2); r.atualizado_em = em; r.por = por;
        res.versao = r.versao;
        break;

      case 'estoque_upsert':
        var it = d.item || {};
        if (!it.id) return erro(op, 'entrada_invalida', 'item de estoque sem id');
        i = acharIdx(L, 'id', it.id);
        var lin = { id: it.id, ingrediente_id: it.ingrediente_id, local: it.local, quantidade: it.quantidade, unidade: it.unidade,
          certeza: it.certeza, vence_em: it.vence_em || '', atualizado_em: em, por: por };
        if (i >= 0) L[i] = lin; else L.push(lin);
        break;

      case 'estoque_remover':
        i = acharIdx(L, 'id', d.id);
        if (i >= 0) L.splice(i, 1); else mexeu = false;
        break;

      case 'estoque_confirmar':
        definirConfig(L, 'estoque_lido_em', d.em || em, em, por);
        definirConfig(L, 'estoque_fonte', d.nada_novo ? 'nada_novo' : (d.fonte || ''), em, por);
        break;

      case 'config_definir':
        var cc = C.CONFIG_CHAVES[d.chave];
        if (ctx.servidor && (!cc || (cc.valores && cc.valores.indexOf(d.valor) < 0))) return erro(op, 'entrada_invalida', 'Config: ' + d.chave + ' = ' + d.valor);
        definirConfig(L, d.chave, d.valor, em, por);
        break;

      case 'movimento_registrar':
        var m = d.movimento || {};
        L.push({ em: m.em || em, ingrediente_id: m.ingrediente_id, local: m.local, delta: m.delta, unidade: m.unidade, motivo: m.motivo, semana_inicio: m.semana_inicio || '', por: por });
        break;

      case 'preferencia_registrar':
        L.push({ chave: d.chave, valor: d.valor, em: em, por: por });
        break;

      case 'livro_upsert':
        var rc = d.receita || {};
        if (!rc.id) return erro(op, 'entrada_invalida', 'receita sem id');
        i = acharIdx(L, 'id', rc.id);
        var linR = { id: rc.id, nome: rc.nome, origem: rc.origem, status: rc.status || 'ativa', fonte_nome: rc.fonte_nome || '', foto_url: rc.foto_url || '',
          json: JSON.stringify(rc), atualizado_em: em, por: por };
        if (i >= 0) L[i] = linR; else L.push(linR);
        break;

      case 'livro_tempo_real':
        i = acharIdx(L, 'id', d.receita_id);

/* ===== app/dados/api-falsa.js ===== */
/* app/dados/api-falsa.js · servidor em memória para ?api=falsa (teste e demonstração, sem login real e sem planilha).
 * Semeado com a massa FICTÍCIA de data/publico/ (A2), embutida pelo build_v2.py em root.MASSA_FALSA.
 * Implementa as ações do CONTRATO §11 com as mesmas regras do §12: idempotência por op_id (aba Ops),
