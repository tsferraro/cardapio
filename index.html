/* app/telas/cozinha.js · Modo cozinha (LEIA.md §2b, SPEC §8 passo 8). Rota #cozinha/<receita_id>[/<passo>].
 * Passo grande, parâmetros tirados do texto do passo (°C, "N-M min", equipamento), timers múltiplos que seguem
 * no topo ao trocar de passo, tela acesa (Wake Lock) e, ao terminar, o tempo real vai para o Livro
 * (op livro_tempo_real; "tempo real" = do começo ao "Terminei" · sugestão Claude · validar).
 * Os passos podem trazer gramas (texto da receita): ficam na zona data-q="receita" (ADR-018 permite).
 * Sem template literal (crase).
 */
(function (root) {
  'use strict';
  var App = root.App;
  var B = App.base, V = function () { return App.vista; }, E = function () { return App.estado; };
  var esc = B.esc, ic = B.ic;

  // estado do modo cozinha (memória do aparelho; timers seguem entre passos e telas)
  var K = App.cozinha = App.cozinha || { receita: null, inicio: null, timers: {}, iv: null, trava: null, trava_ok: false };

  function parseMin(txt) { var m = /(\d+)(?:\s*(?:-|a)\s*(\d+))?\s*min/.exec(txt || ''); return m ? { a: +m[1], b: m[2] ? +m[2] : null } : null; }
  function parametros(txt) {
    var out = [], t = txt || '', m;
    var EQ = [[/air ?fryer/i, 'air fryer'], [/forno/i, 'forno'], [/frigideira/i, 'frigideira'], [/press[aã]o/i, 'panela de pressão'], [/micro-?ondas/i, 'micro-ondas'], [/sanduicheira/i, 'sanduicheira']];
    EQ.forEach(function (e) { if (e[0].test(t)) out.push(e[1]); });
    if ((m = /(\d{2,3})\s*°\s*C/i.exec(t))) out.push(m[1] + ' °C');
    var mm = parseMin(t); if (mm) out.push(mm.a + (mm.b ? '-' + mm.b : '') + ' min');
    if (/metade/i.test(t) && /vir/i.test(t)) out.push('virar na metade');
    return out;
  }
  function mmss(s) { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + (s % 60 < 10 ? '0' : '') + (s % 60); }
  function restante(t) { return t.rodando ? (t.fim - Date.now()) / 1000 : t.resto; }

  function wake(ligar) {
    try {
      if (ligar && root.navigator.wakeLock && !K.trava) {
        root.navigator.wakeLock.request('screen').then(function (l) { K.trava = l; K.trava_ok = true; l.addEventListener('release', function () { K.trava = null; K.trava_ok = false; }); atualizarWake(); }, function () { K.trava_ok = false; atualizarWake(); });
      }
      if (!ligar && K.trava) { K.trava.release(); K.trava = null; K.trava_ok = false; }
    } catch (e) { K.trava_ok = false; }
  }
  function atualizarWake() { var w = B.$('#wake'); if (w) { w.className = 'wake' + (K.trava_ok ? '' : ' off'); w.innerHTML = ic('sun') + (K.trava_ok ? 'Tela acesa' : 'Tela pode apagar'); } }
  root.document.addEventListener('visibilitychange', function () { if (root.document.visibilityState === 'visible' && K.receita && App.ui.telaAtual === 'cozinha') wake(true); });

  function bip() {
    try { if (root.navigator.vibrate) root.navigator.vibrate([300, 150, 300]); } catch (e) { /* ok */ }
    try {
      var A = root.AudioContext || root.webkitAudioContext; if (!A) return;
      var ctx = new A(), o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(ctx.destination); g.gain.value = 0.2; o.start(); o.stop(ctx.currentTime + 0.6);
    } catch (e) { /* sem som */ }
  }
  function tique() {
    var algum = false;
    Object.keys(K.timers).forEach(function (id) {
      var t = K.timers[id]; if (!t.rodando) return;
      algum = true;
      if (restante(t) <= 0) { t.rodando = false; t.resto = 0; t.acabou = true; bip(); App.ui.render(true); }
    });
    B.$$('[data-vivo]').forEach(function (el) { var t = K.timers[el.getAttribute('data-vivo')]; if (t) el.textContent = mmss(restante(t)); });
    if (!algum) { clearInterval(K.iv); K.iv = null; }
  }
  function ligarRelogio() { if (!K.iv) K.iv = setInterval(tique, 1000); }

  function tdock() {
    var ids = Object.keys(K.timers).filter(function (id) { var t = K.timers[id]; return t.rodando || t.acabou; });
    if (!ids.length) return '';
    return '<div class="tdock" aria-label="Timers">' + ids.map(function (id) {
      var t = K.timers[id];
      if (t.acabou) return '<button class="end" role="alert" data-acao="timer-ok" data-id="' + esc(id) + '">' + ic('alert') + esc(t.nome) + ': pronto! <small>ok</small></button>';
      return '<button data-acao="timer-ir" data-passo="' + t.passo + '">' + ic('clock') + esc(t.nome) + ' <span data-vivo="' + esc(id) + '">' + mmss(restante(t)) + '</span> <small>passo ' + (t.passo + 1) + '</small></button>';
    }).join('') + '</div>';
  }

  App.telas.cozinha = function (rid, args) {
    rid = decodeURIComponent(rid || '');
    var R = E().mapaRec()[rid];
    if (!R) return { nav: null, html: App.ui.topo('Modo cozinha') + App.ui.empty('book', 'Receita não encontrada.', 'Ela pode ter saído do Livro. Volte para Hoje.', '<a class="bt pri big" href="#hoje">Voltar para Hoje</a>', true) };
    if (K.receita !== rid) { K.receita = rid; K.inicio = Date.now(); K.timers = {}; }
    var passos = R.passos || [], i = Math.max(0, Math.min(passos.length - 1, parseInt(args[1] || '0', 10) || 0)), passo = passos[i] || '';
    var nomeCurto = B.partes(R.nome)[0], tid = rid + ':' + i, tm = parseMin(passo);
    var h = tdock();
    h += '<div class="cook"><div class="head"><a class="bt sec" href="#hoje" style="min-height:48px;padding:0 12px" aria-label="Sair do modo cozinha" data-acao="cozinha-sair">' + ic('x') + '</a><span class="t">' + esc(nomeCurto) + '</span><span class="wake' + (K.trava_ok ? '' : ' off') + '" id="wake">' + ic('sun') + (K.trava_ok ? 'Tela acesa' : 'Tela pode apagar') + '</span></div>' +
      '<div class="prog" aria-label="Passo ' + (i + 1) + ' de ' + passos.length + '">' + passos.map(function (_, k) { return '<span class="' + (k <= i ? 'on' : '') + '"></span>'; }).join('') + '</div>' +
      '<div class="k">Passo ' + (i + 1) + ' de ' + passos.length + '</div><p class="step" data-q="receita">' + esc(passo) + '</p>';
    var pr = parametros(passo);
    if (pr.length) h += '<div class="chips" data-q="receita">' + pr.map(function (c) { return '<span class="chip">' + esc(c) + '</span>'; }).join('') + '</div>';
    if (tm) {
      var t = K.timers[tid] || (K.timers[tid] = { nome: nomeCurto.split(' ')[0] + ' ' + (i + 1), passo: i, total: tm.a * 60, resto: tm.a * 60, rodando: false, acabou: false, faixa: tm });
      var cls = t.acabou ? ' end' : t.rodando ? ' run' : '';
      h += '<div class="timer' + cls + '" id="tmr"><div class="grow"><div class="lb">Timer do passo ' + (i + 1) + '</div><div class="clock" data-vivo="' + esc(tid) + '">' + mmss(restante(t)) + '</div><div class="lb">faixa ' + tm.a + (tm.b ? '-' + tm.b : '') + ' min</div></div>' +
        '<button class="tbt soft" data-acao="timer-mais" data-d="-60" data-id="' + esc(tid) + '" aria-label="Menos 1 minuto">' + ic('minus') + '</button>' +
        '<button class="tbt soft" data-acao="timer-mais" data-d="60" data-id="' + esc(tid) + '" aria-label="Mais 1 minuto">' + ic('plus') + '</button>' +
        '<button class="tbt" data-acao="timer-go" data-id="' + esc(tid) + '" aria-label="' + (t.rodando ? 'Pausar timer' : 'Iniciar timer') + '">' + ic(t.rodando ? 'pause' : 'play') + '</button></div>';
    } else if (Object.keys(K.timers).some(function (k) { return K.timers[k].rodando; })) {
      h += '<p class="foot-note">Sem tempo neste passo. O timer segue no topo.</p>';
    }
    var ultimo = i >= passos.length - 1;
    h += '<div class="foot">' + (i > 0 ? '<a class="bt sec big" href="#cozinha/' + encodeURIComponent(rid) + '/' + (i - 1) + '">Voltar</a>' : '<a class="bt sec big" href="#hoje">Sair</a>') +
      (ultimo ? '<button class="bt ok big" data-acao="cozinha-fim" data-id="' + esc(rid) + '">' + ic('chk') + 'Terminei</button>'
              : '<a class="bt pri big" href="#cozinha/' + encodeURIComponent(rid) + '/' + (i + 1) + '">Próximo passo ' + ic('right') + '</a>') + '</div></div>';
    return { nav: null, html: h, titulo: 'Cozinhar', temDado: true, after: function () { wake(true); if (Object.keys(K.timers).some(function (k) { return K.timers[k].rodando; })) ligarRelogio(); } };
  };

  App.acoes['timer-go'] = function (b) {
    var t = K.timers[b.getAttribute('data-id')]; if (!t) return;
    if (t.rodando) { t.resto = restante(t); t.rodando = false; }
    else { if (t.resto <= 0) t.resto = t.total; t.acabou = false; t.fim = Date.now() + t.resto * 1000; t.rodando = true; ligarRelogio(); }
    App.ui.render(true);
  };
  App.acoes['timer-mais'] = function (b) {
    var t = K.timers[b.getAttribute('data-id')]; if (!t) return;
    var d = +b.getAttribute('data-d');
    if (t.rodando) t.fim = Math.max(Date.now() + 1000, t.fim + d * 1000); else t.resto = Math.max(60, t.resto + d);
    App.ui.render(true);
  };
  App.acoes['timer-ok'] = function (b) { delete K.timers[b.getAttribute('data-id')]; App.ui.render(true); };
  App.acoes['timer-ir'] = function (b) { App.ui.ir('#cozinha/' + encodeURIComponent(K.receita) + '/' + b.getAttribute('data-passo')); };
  App.acoes['cozinha-sair'] = function () { wake(false); App.ui.ir('#hoje'); };
  App.acoes['cozinha-fim'] = function (b) {
    var rid = b.getAttribute('data-id'), min = Math.max(1, Math.round((Date.now() - (K.inicio || Date.now())) / 60000));
    App.ui.gravar('livro_tempo_real', { receita_id: rid, tempo_real_min: min }, 'livro');
    wake(false); K.receita = null; K.timers = {};
    App.ui.ir('#livro/' + encodeURIComponent(rid));
  };
})(this);

/* ===== app/telas/semana.js ===== */
/* app/telas/semana.js · Semana (LEIA.md §3 + M1, SPEC §5 Semana) e a edição da semana em curso (R41, emenda v2.1).
 * Rotas #semana (esta semana) e #semana/proxima. ≥ 900 px vira quadro de 7 colunas (CSS do mockup, .app.wide).
 * M1: chip do dia pintado inteiro pela proteína do jantar (COR_PROTEINA), marca d'água do ícone, hoje com anel cobalto.
 * Cartão de estado: os 8 estados (R39) e UMA ação (PROXIMA_ACAO).
 * R41 (tela não desenhada, linguagem da Revisar · o Tobia precisa ver): semana aprovada/em compra/em curso, dia que ainda
 * não passou → Trocar, Manter, Pedir ajuste; falha da conferência aparece como alerta (não bloqueia semana já aprovada).
 * Sem template literal (crase).
 */
(function (root) {
  'use strict';
  var App = root.App, C = root.CONTRATO;
  var B = App.base, V = function () { return App.vista; }, E = function () { return App.estado; }, K = function () { return App.comp; };
  var esc = B.esc, ic = B.ic;
  var NOME_ESTADO = { estoque: 'Estoque', pre_cardapio: 'Pré-cardápio', em_revisao: 'Em revisão', aprovada: 'Aprovada', em_compra: 'Em compra', em_curso: 'Em curso', fechada: 'Fechada', arquivada: 'Arquivada' };
  var ROTA_ACAO = { estoque: '#estoque', pre_cardapio: '#precardapio', em_revisao: '#revisar', aprovada: '#compras', em_compra: '#compras', em_curso: '#hoje' };

  function rotulo(inicio) { var fim = B.somarDias(inicio, 6); return inicio.slice(5, 7) === fim.slice(5, 7) ? inicio.slice(8, 10) + ' a ' + B.ddmm(fim) : B.ddmm(inicio) + ' a ' + B.ddmm(fim); }
  function cycleCard(w) {
    var k = C.ESTADOS_SEMANA.indexOf(w.estado), prox = C.ESTADOS_SEMANA[k + 1];
    var acao = C.PROXIMA_ACAO[w.estado], href = ROTA_ACAO[w.estado];
    return '<section class="cycle" aria-label="Estado da semana"><div class="wk"><b>Semana de ' + rotulo(w.inicio) + '</b><span class="pill now">' + NOME_ESTADO[w.estado] + '</span></div>' +
      '<div class="segs" aria-hidden="true">' + C.ESTADOS_SEMANA.map(function (_, x) { return '<span class="' + (x < k ? 'done' : x === k ? 'cur' : '') + '"></span>'; }).join('') + '</div>' +
      '<div class="st"><span>' + (k + 1) + ' de 8: <b>' + NOME_ESTADO[w.estado] + '</b></span><span>depois: ' + (prox ? NOME_ESTADO[prox] : 'fim') + '</span></div>' +
      '<div class="next"><div class="l">Próximo<b>' + esc(acao) + '</b>' + (w.sem.aprovada_em ? '<span class="small">aprovada às ' + B.horaTexto(w.sem.aprovada_em) + ' de ' + B.ddmm(String(w.sem.aprovada_em).slice(0, 10)) + '</span>' : '') + '</div>' +
      (href ? '<a class="bt pri" href="' + href + '">' + esc(acao) + '</a>' : '') + '</div></section>';
  }
  // R41: dia que ainda não passou (o motor decide se houver podeEditarDia)
  function podeEditar(w, i) {
    if (C.EDICAO_EM_CURSO.estados.indexOf(w.estado) < 0) return { pode: false };
    if (root.CardapioMotor.podeEditarDia) return root.CardapioMotor.podeEditarDia(w.sem, i, B.hojeIso());
    var iso = w.sem.dias[i] && w.sem.dias[i].data;
    return iso && iso >= B.hojeIso() ? { pode: true } : { pode: false, motivo: 'dia que já passou não se edita' };
  }

  App.telas.semana = function (st) {
    var prox = st === 'proxima';
    if (!App.sync.temCopia()) return { nav: 'semana', html: App.ui.topo('Semana', 'Carregando…') + '<div class="sk" style="height:150px"></div>' + [1, 2, 3, 4].map(function () { return '<div class="sk" style="height:112px;margin-top:12px"></div>'; }).join('') };
    var seg = B.segundaDe(B.hojeIso()), inicio = prox ? B.somarDias(seg, 7) : seg, w = E().semana(inicio), wProx = E().semana(B.somarDias(seg, 7)), wEsta = E().semana(seg);
    var h = App.ui.topo('Semana', rotulo(inicio));
    h += '<nav class="wkswitch" aria-label="Qual semana"><a href="#semana"' + (!prox ? ' aria-current="page"' : '') + '>Esta semana<small>' + rotulo(seg) + (wEsta ? ' · ' + NOME_ESTADO[wEsta.estado].toLowerCase() : '') + '</small></a>' +
      '<a href="#semana/proxima"' + (prox ? ' aria-current="page"' : '') + '>Próxima<small>' + B.ddmm(B.somarDias(seg, 7)) + (wProx ? ' · ' + NOME_ESTADO[wProx.estado].toLowerCase() : ' · não começou') + '</small></a></nav>';
    if (!w) {
      return { nav: 'semana', temDado: true, wide: true, html: h + App.ui.empty('cal', 'Nenhuma semana montada.', 'Planejar a semana de ' + B.ddmm(inicio) + ' leva cerca de 15 minutos.', '<button class="bt pri big" data-acao="planejar" data-inicio="' + inicio + '">Planejar a semana de ' + B.ddmm(inicio) + '</button>') };
    }
    h += cycleCard(w);
    var temJantar = (w.sem.dias || []).some(function (d) { return d && d.jantar && d.jantar.receita_id; });
    if (!temJantar) {
      h += '<p class="foot-note">Os jantares aparecem depois do estoque e do contexto, no pré-cardápio.</p>';
      return { nav: 'semana', temDado: true, wide: true, html: h };
    }
    if ((w.sem.dias || []).length < 7) {
      return { nav: 'semana', wide: true, html: h + App.ui.empty('alert', 'A semana não abriu.', 'O dado da planilha veio incompleto (faltam ' + (7 - w.sem.dias.length) + ' dias). Nada foi apagado.', '<button class="bt pri big" data-acao="recarregar">Tentar de novo</button>', true) };
    }
    var T = App.planejamento || {};
    if (T.aplicando && T.aplicando.inicio === w.inicio) {
      h += '<div class="stat" role="status"><span class="ico b">' + ic('refresh') + '</span><div><h2>Aplicando seus pedidos…</h2><p>Refaço só os dias com pedido. O que já passou não muda.</p></div></div>';
    } else if (T.resultado && T.resultado.inicio === w.inicio && T.resultado.itens.length) {
      h += App.comp.resultadoHTML(T.resultado.itens, w.sem) + '<button class="lnk" data-acao="fechar-resultado">Fechar o resumo</button>';
    }
    var calc = E().calc(w.inicio), hoje = B.hojeIso(), edicao = C.EDICAO_EM_CURSO.estados.indexOf(w.estado) >= 0;
    var dias = [0, 1, 2, 3, 4, 5, 6].map(function (i) { return K().diaVista(w, calc, i); });
    h += '<div class="daytabs" role="list" aria-label="Dias">' + dias.map(function (d) {
      var ehHoje = d.iso === hoje, cat = d.jantar ? V().catDe(d.jantar) : 'livre';
      return '<a role="listitem" class="dtab' + (ehHoje ? ' today' : '') + '"' + (ehHoje ? ' aria-current="date"' : '') + ' aria-label="' + d.nome + ' ' + d.dd + ', ' + V().NOME_DA_COR[cat] + (ehHoje ? ', hoje' : '') + '" style="--c:' + V().corVar(cat) + '" href="#semana' + (prox ? '/proxima' : '') + '" data-acao="rolar-dia" data-dia="' + d.id + '">' +
        V().wm(cat) + '<span class="dw">' + d.ab + '</span><span class="dn">' + d.dd + '</span>' + (ehHoje ? '<span class="hj">hoje</span>' : '') + '</a>';
    }).join('') + '</div>';
    h += K().legendHTML();
    // R41: só contam pedidos de dias que ainda não passaram (o pedido da semana é do planejamento, não da edição em curso)
    var editaveis = edicao ? dias.filter(function (d) { return d.jantar && podeEditar(w, d.i).pode; }).map(function (d) { return d.id; }) : [];
    var corte = [w.sem.aprovada_em, w.sem.pedidos_aplicados_em].filter(Boolean).sort(B.cmpTempo).pop() || '';
    var diasPed = editaveis.filter(function (id) { var p = (w.sem.pedidos || {})[id]; return K().temPedido(p) && B.depois(p.em, corte) && !(w.sem.dias_travados || {})[id]; });
    var res = { tem: diasPed.length > 0, dias: diasPed, texto: B.plural(diasPed.length, 'dia', 'dias') + ' com pedido' };
    h += '<div class="board" style="margin-top:4px">' + dias.map(function (d) {
      var o = { today: d.iso === hoje, issues: K().issuesDoDia(calc, d).map(function (x) { return edicao && x.s === 'falha' ? { s: 'alerta', t: x.t } : x; }) };
      o.warn = o.issues.length > 0; o.locked = !!(w.sem.dias_travados || {})[d.id];
      if (edicao && d.jantar) {
        var pe = podeEditar(w, d.i);
        if (pe.pode) o.ctrl = K().pedCtrl(w, d, { trocar: true, trocando: !!App.trocando[w.inicio + d.id] }) + K().trocarHTML(w, d);
        // BACKLOG 104: dia livre por evento também diz o porquê (texto do podeEditarDia)
        else if (pe.motivo && (d.iso < hoje || root.CardapioMotor.dados.livrePorEvento(d.dia, d.i))) o.ctrl = '<div class="pedsum lk">' + ic('lock') + '<span>' + esc(pe.motivo) + '</span></div>';
      }
      return K().dayCard(d, o);
    }).join('') + '</div>';
    h += '<div class="wide-grid"><div><h2 class="t">Metas da semana</h2>' + K().metersHTML(calc.metas) + '</div>';
    var cl = (calc.checklist || []).map(function (c) { return edicao && c.status === 'falha' ? Object.assign({}, c, { status: 'alerta' }) : c; }), cs = K().checkSum(cl);
    h += '<div><h2 class="t">Conferência <small>' + cl.length + ' itens</small></h2><div class="card"><div class="row" style="flex-wrap:wrap;gap:6px">' + cs.html + '</div>' + K().conferenciaHTML(cl) + '</div></div></div>';
    if (edicao && res.tem) {
      h += '<div class="dock"><div class="in"><div class="sum">' + ic('txt') + '<span>' + esc(res.texto) + '</span></div><button class="bt pri big full" data-acao="aplicar-pedidos" data-inicio="' + w.inicio + '" data-so="' + res.dias.join(',') + '" data-volta="' + (prox ? '#semana/proxima' : '#semana') + '">Aplicar meus pedidos</button></div></div>';
    }
    return { nav: 'semana', html: h, wide: true, temDado: true, titulo: 'Semana', flow: edicao && res.tem };
  };

  App.acoes['fechar-resultado'] = function () { App.planejamento.resultado = null; App.ui.render(true); };
  App.acoes['rolar-dia'] = function (b) {
    var el = B.$('#d-' + b.getAttribute('data-dia'));
    if (el) el.scrollIntoView({ behavior: B.reduzMovimento() ? 'auto' : 'smooth', block: 'start' });
  };
  App.acoes.planejar = function (b) {
    var inicio = b.getAttribute('data-inicio');
    App.planejar.garantirSemana(inicio).then(function () { App.ui.ir('#estoque'); });
  };
})(this);

/* ===== app/telas/estoque.js ===== */
/* app/telas/estoque.js · Estoque, passo 1 de 5 (LEIA.md §4 + M4, SPEC §5 Estoque). Rotas #estoque e #estoque/congelador.
 * Foto → llm_ler_foto (Gemini, ADR-019) com a imagem reduzida no celular (≤ 1600 px, JPEG); nada é gravado antes de
 * "Confirmar" (ops estoque_upsert + estoque_confirmar). Caixa de texto grava sozinha como Config.estoque_rascunho

/* app/telas/config.js · Config (SPEC §5 "Mais, Porção da Julia e Config", CONTRATO §9 modo_llm/llm_provedor/llm_custo_mes, R42).
 * Tela NOVA, não desenhada no mockup: mesma linguagem visual de Mais (cartão com linhas de 64 px). O Tobia precisa ver.
 *  - chave "Montar com o <provedor>" = op config_definir modo_llm (ligado/desligado), com a frase do que muda;
 *  - provedor (R42, emenda v2.1): escolha entre LLM.PROVEDORES ∩ LLM.PROVEDORES_DADO_REAL, op config_definir llm_provedor;
 *  - ADR-026 (R43 revogada na v2.7): o Gemini recebe qualquer tarefa, com ou sem faturamento; a tela só informa
 *    "nível gratuito" quando Config.gemini_pago (espelho da Script Property) não é 'sim';
 *  - custo do mês: soma de LlmLog.custo_usd do mês × câmbio fixo (App.config.CAMBIO_USD_EUR · sugestão Claude · validar).
 * Sem template literal (crase).
 */
(function (root) {
  'use strict';
  var App = root.App, C = root.CONTRATO;
  var B = App.base, E = function () { return App.estado; };
  var esc = B.esc, ic = B.ic;
  var NOME = { claude: 'Claude', gemini: 'Gemini' };
  var MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];

  function provedoresPermitidos() { return C.LLM.PROVEDORES.filter(function (p) { return C.LLM.PROVEDORES_DADO_REAL.indexOf(p) >= 0; }); }
  function custoDoMes() {
    var mes = B.hojeIso().slice(0, 7), usd = 0, n = 0;
    E().llmLog().forEach(function (l) { if (String(l.em || '').slice(0, 7) === mes) { usd += Number(l.custo_usd) || 0; n++; } });
    return { eur: usd * App.config.CAMBIO_USD_EUR, n: n, mes: MESES[+mes.slice(5, 7) - 1] };
  }

  App.telas.config = function () {
    var ligado = E().config('modo_llm') === 'ligado', prov = E().config('llm_provedor') || 'claude', nome = NOME[prov] || prov;

      (ligado ? 'O ' + esc(nome) + ' propõe a semana; o motor confere o plano da nutricionista antes de você ver.'
              : 'O motor monta a semana. O pedido em texto livre vai ao Gemini, que só traduz; quem escolhe é o motor.') +
      '</small></span><span class="sw" aria-hidden="true"></span></button></section>';
    // R42 + ADR-026: as duas IAs aprovadas montam a semana; o Gemini sem faturamento é o nível gratuito (só informação)
    var ps = provedoresPermitidos(), pago = String(E().config('gemini_pago') || 'nao') === 'sim';
    h += '<h2 class="t">Qual IA</h2><section class="card"><h3 class="h" style="font-size:16px;color:var(--mute)">Montar a semana com IA</h3><div class="opt" role="radiogroup" aria-label="IA que monta a semana">' + ps.map(function (p) {
      var grat = p === 'gemini' && !pago;
      return '<button role="radio" aria-checked="' + (p === prov) + '" aria-pressed="' + (p === prov) + '" data-acao="llm-provedor" data-v="' + p + '">' + esc(NOME[p] || p) + (grat ? '<small>nível gratuito</small>' : '') + '</button>';
    }).join('') + '</div>' +
      (!pago ? '<p class="foot-note" id="gemini-nota">Gemini no nível gratuito: vale para montar a semana, com limite de chamadas por minuto e por dia.</p>' : '') +
      '<div class="kv"><span class="l">Foto e pedido de ajuste<small>leitura de foto e tradução do texto do pedido</small></span><span class="v">Gemini</span></div>' +
      '<p class="foot-note">Só aparecem as IAs aprovadas para o dado da família. O modelo de cada tarefa fica na planilha.</p></section>';
    var cm = custoDoMes();
    h += '<h2 class="t">Custo</h2><section class="card" style="padding:4px 12px"><div class="kv" style="border-top:0"><span class="l">Custo de IA em ' + cm.mes + '<small>' + B.plural(cm.n, 'chamada', 'chamadas') + ' registradas</small></span><span class="v">' + B.eur(cm.eur) + '</span></div>' +
      '<p class="foot-note" style="margin:0 0 10px">Câmbio fixo de ' + B.num(App.config.CAMBIO_USD_EUR, 2) + ' € por dólar (sugestão Claude · validar).</p></section>';
    return { nav: 'mais', html: h, temDado: App.sync.temCopia(), titulo: 'Config' };
  };

  App.acoes['modo-llm'] = function (b) {
    var novo = b.getAttribute('aria-checked') === 'true' ? 'desligado' : 'ligado';
    App.ui.gravar('config_definir', { chave: 'modo_llm', valor: novo });
  };
  App.acoes['llm-provedor'] = function (b) {
    var v = b.getAttribute('data-v');
    if (b.disabled) return;

    App.ui.gravar('config_definir', { chave: 'llm_provedor', valor: v });
  };
})(this);

/* app/autoteste.js · roteiro do autoteste no navegador (portão do deploy.sh, chamado por tests/app/rodar_autoteste.sh).
 * Só existe com ?api=falsa&autoteste=1. COMPLETA os fluxos com dado (não só renderiza) e afirma o que a pessoa vê
 * e o que o servidor (falso, mesmas regras do §12) gravou. Esperados saem do contrato e do motor, nunca de literal inventado.
 * Reprova: diálogo nativo, rolagem lateral, alvo < 44 px, travessão, grama fora das zonas permitidas (ADR-018),
 * etiqueta "exemplo" na tela, texto de sincronia diferente do LEIA.md §Sincronia.
 * Erro de console e diálogo nativo também são vigiados de fora, pelo protocolo do DevTools (tests/app/autoteste.js).
 * Sem template literal (crase).

(function (root) {
  'use strict';
  var App = root.App = root.App || {};

  var C = root.CONTRATO;

  var linhas = [], falhas = 0, dialogos = [];

  });

  function ok(cond, texto, detalhe) {

        var v; try { v = fn(); } catch (e) { v = false; }
        if (v) return res(true);
        if (Date.now() > fim) return res(false);
        setTimeout(volta, passo || 60);

  function configServidor(ch) { var l = linhasServidor('Config').filter(function (x) { return x.chave === ch; })[0]; return l ? l.valor : null; }
  var HORA = /\d{1,2}h\d{2}/;

  // ---------- conferências de toda tela ----------
  function zonaPermitida(n) { return n.parentElement && n.parentElement.closest('[data-q]'); }
  function verificarTela(nome) {
    var de = root.document.documentElement, p = [];
    if (de.scrollWidth > de.clientWidth + 1) p.push('rolagem lateral ' + de.scrollWidth + '/' + de.clientWidth);
    var peq = [];
    $$('a,button,select,input,textarea,summary,[role="checkbox"],[role="switch"]').forEach(function (x) {
      if (x.closest('.gis') || x.classList.contains('sr') || x.type === 'file') return;
      var r = x.getBoundingClientRect(); if (!r.width || !r.height) return;
      if (getComputedStyle(x).visibility === 'hidden') return;
      if (r.height < 43.5 || r.width < 43.5) peq.push((x.className || x.tagName).toString().split(' ')[0] + ':' + Math.round(r.width) + 'x' + Math.round(r.height));
    });
    if (peq.length) p.push('alvo < 44 px: ' + peq.slice(0, 6).join(' '));

    var tv = /[—–]/.exec(corpo); if (tv) p.push('travessão: "…' + corpo.slice(Math.max(0, tv.index - 30), tv.index + 20).replace(/\s+/g, ' ') + '…"');
    var w = root.document.createTreeWalker(B().$('#main'), NodeFilter.SHOW_TEXT), n, gr = [];
    while ((n = w.nextNode())) {
      if (!n.nodeValue.trim() || zonaPermitida(n)) continue;
      var m = /(\d+(?:[.,]\d+)?)\s?(g|kg)\b/.exec(n.nodeValue);

          ok(/foto/.test(texto('.empty h2')), T + 'D4: erro numa leitura de foto fala de "foto"', texto('.empty h2'));
          // o erro não persiste ao navegar
          return ir('#hoje');
        }).then(function () { return ir('#estoque'); }).then(function () {
          ok(L.estado !== 'erro' && !/Não consegui ler/.test(texto('#main')), T + 'D4: depois de navegar para outra tela e voltar, o erro não está mais lá', { estado: L.estado });
          L.estado = null; L.texto = false; L.itens = [];
        });
      });
    });
  };
})(this);

/* ---------- K2a (BACKLOG 151, ADR-028): falha do checklist avisa, nunca bloqueia ---------- */
/* Reabre a semana aprovada do roteiro (aprovada -> em_revisao é reabrir) e aprova de novo com o checklist forçado:
 * 2 falhas + 1 alerta (ids reais do motor) e, no 2º caso, tudo ok. O resto da tela é o real. */
(function (root) {
  'use strict';
  var App = root.App;
  if (!App.config || !App.config.AUTOTESTE) return;
  var C = root.CONTRATO, B = App.base;
  App.autoteste.faseK2a = function (h) {
    var ok = h.ok, ir = h.ir, ate = h.ate, esperar = h.esperar, clicar = h.clicar, texto = h.texto, $ = h.$, $$ = h.$$, sem = h.semanaServidor;
    var E = function () { return App.estado; }, T = 'K2a ';
    var seg = B.segundaDe(B.hojeIso()), prox = B.somarDias(seg, 7), calc0 = null;
    var FALHAS = ['leguminosas_3_dias', 'folhas_todo_dia'], ALERTA = 'estoque_descontado';
    function fila0() { return App.sync.pendentes() === 0 && App.sync.st.estado !== 'enviando'; }
    function forcar(comAviso) {
      calc0 = E().calc;
      E().calc = function (i, x) {
        var c = calc0.apply(this, arguments);
        if (i !== prox || x) return c;
        var cl = (c.checklist || []).map(function (it) {
          var n = Object.assign({}, it);
          if (comAviso && FALHAS.indexOf(n.id) >= 0) { n.status = 'falha'; n.detalhe = 'Falha forçada pelo autoteste.'; }
          else if (comAviso && n.id === ALERTA) { n.status = 'alerta'; n.detalhe = 'Alerta forçado pelo autoteste.'; }
          else if (n.status === 'falha' || n.status === 'alerta' || n.status === 'manual') n.status = 'ok';
          return n;
        });
        return Object.assign({}, c, { checklist: cl });
      };
    }
    function soltar() { if (calc0) { E().calc = calc0; calc0 = null; } }
    function reabrir() {
      return App.planejar.transitar(prox, 'em_revisao').then(function () { return ate(function () { return fila0() && sem(prox).estado === 'em_revisao'; }, 6000); });
    }
    function caso(nome, fn) {
      return Promise.resolve().then(fn).catch(function (e) { soltar(); ok(false, T + nome + ': o caso quebrou', String(e && (e.stack || e.message) || e).slice(0, 240)); });
    }

    return caso('2 falhas e 1 alerta', function () {
      return reabrir().then(function (v) {
        ok(v, T + 'a semana aprovada reabre em em_revisao (aprovada -> em_revisao)', sem(prox) && sem(prox).estado);
        forcar(true);
        return ir('#revisar').then(function () { App.ui.render(true); return esperar(100); });
      }).then(function () {
        ok(App.planejar.alvo() === prox, T + 'o Revisar abre a semana reaberta', App.planejar.alvo());
        var bt = $('[data-acao="aprovar"]');
        ok(!!bt && !bt.disabled && /Aprovar a semana/.test(texto(bt)), T + 'com 2 falhas o botão "Aprovar a semana" está habilitado', texto('.dock'));
        ok(!/Resolva/.test(texto('.dock')) && !$('.dock button[disabled]'), T + 'nenhum botão desabilitado nem "Resolva N falhas" no rodapé', texto('.dock'));
        ok(/2 falhas/.test(texto('.dock .sum')) && $$('div.card .row .pill.falha').length === 2, T + 'as falhas seguem em vermelho: chip "2 falhas" e um cartão "falha" por item', texto('.dock .sum'));
        clicar(bt);
        return esperar(200);
      }).then(function () {
        ok(!!$('.sheet') && texto('.sheet h2') === 'Aprovar com 2 falhas e 1 alerta?', T + 'a folha diz "Aprovar com 2 falhas e 1 alerta?"', texto('.sheet h2'));
        var lis = $$('.sheet .chk li');
        ok(lis.length === 3 && $$('.sheet .pill.falha').length === 2 && $$('.sheet .pill.alerta').length === 1, T + 'a folha lista as 3 linhas (2 falhas, 1 alerta)', lis.length);
        ok(/Leguminosas em pelo menos 3 dias\?/.test(texto('.sheet')) && /Folhas verde-escuras todos os dias\?/.test(texto('.sheet')), T + 'a folha traz o texto de cada falha', texto('.sheet').slice(0, 160));
        ok(!!$('.sheet [data-acao="fechar-folha"]') && /Voltar e revisar/.test(texto('.sheet [data-acao="fechar-folha"]')), T + 'a folha tem "Voltar e revisar"');
        clicar('.sheet [data-acao="fechar-folha"]');
        return esperar(250);
      }).then(function () {
        ok(!$('.sheet') && sem(prox).estado === 'em_revisao', T + '"Voltar e revisar" fecha a folha e não aprova', sem(prox).estado);
        clicar('[data-acao="aprovar"]');
        return esperar(200);
      }).then(function () {
        clicar('.sheet [data-acao="aprovar-ok"]');
        return ate(function () { return root.location.hash.indexOf('#entregas') === 0 && fila0() && sem(prox).estado === 'aprovada'; }, 8000);
      }).then(function (v) {
        var s = sem(prox) || {};
        ok(v && s.aprovada_por === 'tobia' && !!s.aprovada_em, T + 'confirmar na folha aprova a semana com falha (sem transicao_invalida)', { estado: s.estado, por: s.aprovada_por });
        ok(JSON.stringify((s.falhas_aceitos || []).slice().sort()) === JSON.stringify(FALHAS.slice().sort()), T + 'a semana grava falhas_aceitos com as 2 falhas', s.falhas_aceitos);
        ok(JSON.stringify(s.alertas_aceitos) === JSON.stringify([ALERTA]), T + 'e alertas_aceitos com o alerta', s.alertas_aceitos);
        var st = texto('.stat');
        ok(/2 falhas aceitas/.test(st) && /Leguminosas em pelo menos 3 dias\?/.test(st) && /Folhas verde-escuras todos os dias\?/.test(st) && /1 alerta aceito/.test(st), T + 'Entregas mostra as falhas aceitas com o texto de cada uma, e o alerta', st);
        soltar();
      });
    }).then(function () {
      return caso('sem falha nem alerta', function () {
        return reabrir().then(function () {
          forcar(false);
          return ir('#revisar').then(function () { App.ui.render(true); return esperar(100); });
        }).then(function () {
          var bt = $('[data-acao="aprovar"]');
          ok(!!bt && !bt.disabled, T + 'sem falha nem alerta o botão segue habilitado', texto('.dock'));
          clicar(bt);
          return ate(function () { return root.location.hash.indexOf('#entregas') === 0 && fila0() && sem(prox).estado === 'aprovada'; }, 8000);
        }).then(function (v) {
          var s = sem(prox) || {};
          ok(v && !$('.sheet'), T + 'sem falha nem alerta aprova direto, sem folha', { estado: s.estado });
          ok(JSON.stringify(s.falhas_aceitos) === '[]' && JSON.stringify(s.alertas_aceitos) === '[]', T + '... e grava as duas listas vazias', { f: s.falhas_aceitos, a: s.alertas_aceitos });
          soltar();
        });
      });
    });
  };
})(this);

</script>
</body>
</html>
